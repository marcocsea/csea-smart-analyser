<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSEA Smart Analyser v3.0</title>
<style>
:root{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#f8fafc;--border:#e2e8f0;--text:#1e293b;--sub:#64748b;--green:#16a34a;--red:#dc2626;--blue:#3b82f6;--gold:#d97706;--cyan:#0891b2;--purple:#7c3aed;--orange:#ea580c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px;min-height:100vh}
.header{background:#1e40af;padding:0 20px;height:52px;display:flex;align-items:center;gap:12px}
.logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:0}
.logo span{color:#bfdbfe}
.badge{background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.smart-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.toolbar{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-size:11px;color:#64748b}
select{background:#f8fafc;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
input[type=date]{background:#f8fafc;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
button{padding:7px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-smart{background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff}.btn-smart:hover{opacity:.9}
.status-dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.tabs{background:#ffffff;border-bottom:2px solid #e2e8f0;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;transition:all .15s;white-space:nowrap}
.tab.active{color:#1e40af;border-bottom-color:#3b82f6}
.main{padding:20px;max-width:1400px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.kpi-val{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:2px}
.kpi-sub{font-size:11px;color:var(--sub)}
.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.cyan{color:var(--cyan)}.blue{color:var(--blue)}
.analysis-panel{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;margin-bottom:16px}
.analysis-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.analysis-icon{width:34px;height:34px;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.analysis-title{font-size:14px;font-weight:700;color:#1e293b}
.analysis-subtitle{font-size:11px;color:var(--sub)}
.insight-block{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-bottom:10px;border-left:3px solid #3b82f6}
.insight-block.warn{border-left-color:var(--gold)}
.insight-block.good{border-left-color:var(--green)}
.insight-block.bad{border-left-color:var(--red)}
.insight-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;color:var(--sub)}
.insight-block.warn .insight-label{color:var(--gold)}
.insight-block.good .insight-label{color:var(--green)}
.insight-block.bad .insight-label{color:var(--red)}
.insight-text{font-size:13px;color:#334155;line-height:1.7}
.insight-text strong{color:#1e293b}
.rec-list{list-style:none;margin-top:8px}
.rec-list li{padding:5px 0;font-size:12px;color:#475569;display:flex;gap:8px;line-height:1.5}
.rec-list li::before{content:'→';color:var(--blue);flex-shrink:0;font-weight:700}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.check-row:last-child{border-bottom:none}
.check-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ci-ok{background:rgba(34,197,94,.15);color:var(--green)}
.ci-warn{background:rgba(245,158,11,.15);color:var(--gold)}
.ci-fail{background:rgba(239,68,68,.15);color:var(--red)}
.check-label{font-size:12px;font-weight:600;color:#1e293b;flex:1}
.check-detail{font-size:11px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f8fafc;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge-buy{background:rgba(34,197,94,.15);color:var(--green);padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.badge-sell{background:rgba(239,68,68,.15);color:var(--red);padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.badge-blocked{background:rgba(245,158,11,.15);color:var(--gold);padding:2px 7px;border-radius:4px;font-size:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.pill-g{background:rgba(34,197,94,.15);color:var(--green)}
.pill-r{background:rgba(239,68,68,.15);color:var(--red)}
.tbl-wrap{overflow-x:auto;max-height:380px;overflow-y:auto}
.snap-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snap-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
.snap-cur{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px}
.snap-val{font-size:16px;font-weight:800}
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-bar{height:100%;border-radius:3px;transition:width .5s}
.anomaly-item{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px;margin-bottom:8px}
.anomaly-item.aw{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2)}
.anomaly-title{font-size:12px;font-weight:700;color:var(--red);margin-bottom:4px}
.anomaly-item.aw .anomaly-title{color:var(--gold)}
.anomaly-desc{font-size:11px;color:var(--sub);line-height:1.6}
#loadStatus{font-size:11px;color:var(--sub)}
.score-ring{display:flex;align-items:center;gap:16px}
.score-circle{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;border:3px solid}
.hour-chart{display:flex;flex-direction:column;gap:4px}
.hour-row{display:flex;align-items:center;gap:10px;padding:3px 0}
.hour-label{font-size:11px;font-weight:700;color:var(--sub);width:50px;flex-shrink:0;text-align:right}
.hour-bar-wrap{flex:1;display:flex;align-items:center;gap:8px}
.hour-bar{height:22px;border-radius:3px;min-width:3px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.hour-stats{font-size:11px;color:var(--sub);white-space:nowrap;min-width:140px}
.exit-tp{background:rgba(34,197,94,.15);color:var(--green);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-sl{background:rgba(239,68,68,.15);color:var(--red);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-ea{background:rgba(8,145,178,.15);color:var(--cyan);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-manual{background:rgba(245,158,11,.15);color:var(--gold);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.src-badge{background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CSEA <span>Smart</span> Analyser</div>
  <div class="badge">v3.0</div>
  <div class="smart-badge">positions table</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusTxt" style="font-size:11px;color:var(--sub)">Idle</span>
  </div>
</div>

<div class="toolbar">
  <span class="lbl">Account:</span>
  <select id="acctSelect"></select>
  <span class="lbl">Clean Start:</span>
  <input type="date" id="cleanStart" value="2026-03-23">
  <button class="btn-primary" onclick="loadData()">Load &amp; Analyse</button>
  <button class="btn-smart" onclick="setTab('analysis',null);render()">Smart Analysis</button>
  <span id="loadStatus"></span>
</div>

<div class="tabs" id="tabBar">
  <button class="tab active" onclick="setTab('overview',this)">Overview</button>
  <button class="tab" onclick="setTab('analysis',this)">Smart Analysis</button>
  <button class="tab" onclick="setTab('hour',this)">Hour of Day</button>
  <button class="tab" onclick="setTab('pairs',this)">Pair Performance</button>
  <button class="tab" onclick="setTab('exits',this)">Exit Analysis</button>
  <button class="tab" onclick="setTab('positions',this)">Positions</button>
  <button class="tab" onclick="setTab('signals',this)">Signals</button>
  <button class="tab" onclick="setTab('compound',this)">Compound</button>
  <button class="tab" onclick="setTab('snapshot',this)">Currency Snapshot</button>
  <button class="tab" onclick="setTab('anomalies',this)">Anomalies</button>
</div>

<div class="main" id="mainContent">
  <div class="empty">
    <div style="font-size:36px;margin-bottom:10px">🧠</div>
    <p style="color:#1e293b;font-size:15px;font-weight:700;margin-bottom:6px">CSEA Smart Analyser v3.0</p>
    <p style="color:var(--sub)">Select an account, set clean-start date, then click Load &amp; Analyse</p>
  </div>
</div>

<script>
var SB_URL = 'https://nmyveijljquxvhjelqbc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5teXZlaWpsanF1eHZoamVscWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjc2MjgsImV4cCI6MjA4Nzk0MzYyOH0.YT-sAh2Spn1805dnylTsZ2gBx-T7yC6fyOKIs0YPlP4';
var HDR = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY};

var db = {posData:[], signals:[], daily:[], trades:[]};
var acctId = '', activeTab = 'overview';
var checks = [], anomalies = [], insights = [];

function cleanStartDate() {
  return document.getElementById('cleanStart').value || '2026-03-23';
}

async function sb(table, params) {
  var PAGE = 1000, all = [], from = 0;
  while(true) {
    var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + params + '&limit=' + PAGE + '&offset=' + from, {
      headers: Object.assign({}, HDR, {'Range-Unit':'items','Range':from+'-'+(from+PAGE-1)})
    });
    if(!r.ok) break;
    var pg = await r.json();
    all = all.concat(pg);
    if(pg.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

async function loadData() {
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusTxt');
  var cs = cleanStartDate();
  dot.className = 'status-dot'; txt.textContent = 'Loading...';
  document.getElementById('loadStatus').textContent = 'Fetching...';
  try {
    var accts = await sb('accounts', 'select=id,label,account_number&strategy=eq.CSEA&order=label');
    var sel = document.getElementById('acctSelect');
    sel.innerHTML = '<option value="">All CSEA Accounts</option>';
    accts.forEach(function(a) {
      var o = document.createElement('option');
      o.value = a.id; o.textContent = a.label || a.account_number;
      sel.appendChild(o);
    });
    if(!acctId && accts.length) { sel.value = accts[0].id; acctId = accts[0].id; }

    var af = acctId ? '&account_id=eq.' + acctId : '';
    var df_pos = cs ? '&open_time=gte.' + cs + 'T00:00:00' : '';
    var df_sig = cs ? '&ts=gte.' + cs + 'T00:00:00' : '';
    var df_day = cs ? '&date=gte.' + cs : '';

    var res = await Promise.all([
      sb('positions', 'select=*&order=open_time' + af + df_pos),
      sb('signals',   'select=*&order=ts' + af + df_sig),
      sb('daily',     'select=*&order=date' + af + df_day),
      sb('trades',    'select=ticket,event,symbol,direction,ts,entry,lot' + af + '&event=eq.OPEN')
    ]);
    db.posData  = res[0];
    db.signals  = res[1];
    db.daily    = res[2];
    db.trades   = res[3];

    dot.className = 'status-dot live'; txt.textContent = 'Live';
    document.getElementById('loadStatus').textContent =
      db.posData.length + ' positions · ' + db.signals.length + ' signals · ' + db.daily.length + ' days';
    runAnalysis(); render();
  } catch(e) {
    dot.className = 'status-dot'; txt.textContent = 'Error';
    document.getElementById('loadStatus').textContent = 'Error: ' + e.message;
  }
}

function fmtPnl(v) { var n = parseFloat(v||0); return (n>=0?'+':'') + n.toFixed(2); }
function fmtPct(v) { return v.toFixed(1) + '%'; }
function siIcon(s) { return s==='ok'?'✓':s==='warn'?'⚠':'✗'; }
function siCls(s) { return s==='ok'?'ci-ok':s==='warn'?'ci-warn':'ci-fail'; }

function getStats() {
  var pos = db.posData;
  var wins = pos.filter(function(p){ return parseFloat(p.net_profit||0) > 0; });
  var losses = pos.filter(function(p){ return parseFloat(p.net_profit||0) < 0; });
  var totalPnl = pos.reduce(function(a,p){ return a + parseFloat(p.net_profit||0); }, 0);
  var avgWin = wins.length ? wins.reduce(function(a,p){ return a+parseFloat(p.net_profit||0); },0)/wins.length : 0;
  var avgLoss = losses.length ? losses.reduce(function(a,p){ return a+parseFloat(p.net_profit||0); },0)/losses.length : 0;
  var rr = avgLoss ? Math.abs(avgWin/avgLoss) : 0;
  var opened = db.signals.filter(function(s){ return s.result==='OPENED'; }).length;
  var lastDaily = db.daily.length ? db.daily[db.daily.length-1] : null;
  var openPos = db.trades.filter(function(t){ return t.event==='OPEN'; }).length;
  return {
    closed: pos.length, wins: wins.length, losses: losses.length,
    wr: pos.length ? wins.length/pos.length*100 : 0,
    totalPnl: totalPnl, avgWin: avgWin, avgLoss: avgLoss, rr: rr,
    opened: opened, blocked: db.signals.length - opened,
    positions: openPos, lastDaily: lastDaily
  };
}

function getPairStats() {
  var map = {};
  db.posData.forEach(function(p) {
    var s = p.symbol||'?';
    if(!map[s]) map[s]={sym:s,trades:0,wins:0,losses:0,pnl:0,winPnl:0,lossPnl:0};
    map[s].trades++;
    var n = parseFloat(p.net_profit||0);
    map[s].pnl += n;
    if(n>0){map[s].wins++;map[s].winPnl+=n;}else{map[s].losses++;map[s].lossPnl+=n;}
  });
  return Object.values(map).sort(function(a,b){return b.pnl-a.pnl;});
}

function getHourStats() {
  var map = {};
  db.posData.forEach(function(p) {
    if(!p.open_time) return;
    var h = new Date(p.open_time).getUTCHours();
    if(!map[h]) map[h]={hour:h,trades:0,wins:0,pnl:0};
    map[h].trades++;
    var n = parseFloat(p.net_profit||0);
    map[h].pnl += n;
    if(n>0) map[h].wins++;
  });
  var arr = [];
  for(var h=0;h<24;h++){if(map[h]) arr.push(map[h]);}
  return arr;
}

function getExitStats() {
  var pos = db.posData;
  var tp = pos.filter(function(p){ return p.close_reason==='tp'; });
  var sl = pos.filter(function(p){ return p.close_reason==='sl'; });
  var ea = pos.filter(function(p){ return p.close_reason==='ea'; });
  var manual = pos.filter(function(p){ return p.close_reason==='manual'; });
  function avg(arr) { return arr.length ? arr.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0)/arr.length : 0; }
  return {
    tp:tp.length, sl:sl.length, ea:ea.length, manual:manual.length,
    avgTp:avg(tp), avgSl:avg(sl), avgEa:avg(ea), avgManual:avg(manual),
    allPos: pos
  };
}

function runAnalysis() {
  checks=[]; anomalies=[]; insights=[];
  var s = getStats();
  var pairs = getPairStats();
  var hourData = getHourStats();
  var exits = getExitStats();
  var lastDaily = db.daily.length ? db.daily[db.daily.length-1] : null;
  var targetHitDays = db.daily.filter(function(d){return d.target_hit;}).length;
  var blockReasons = {};
  db.signals.filter(function(sg){return sg.result==='BLOCKED';}).forEach(function(sg){
    var r=sg.block_reason||'Unknown'; blockReasons[r]=(blockReasons[r]||0)+1;
  });

  var lastSig = db.signals.length ? db.signals[db.signals.length-1] : null;
  var minsAgo = lastSig ? Math.round((Date.now()-new Date(lastSig.ts))/60000) : 9999;
  checks.push({label:'Push Connectivity',detail:lastSig?'Last signal '+(minsAgo<60?minsAgo+'m':Math.round(minsAgo/60)+'h')+' ago':'No signals',status:minsAgo<180?'ok':minsAgo<600?'warn':'fail'});

  var openRate = db.signals.length ? Math.round(s.opened/db.signals.length*100) : 0;
  checks.push({label:'Signal Open Rate',detail:s.opened+'/'+db.signals.length+' opened ('+openRate+'%)',status:openRate>3&&openRate<70?'ok':openRate===0?'fail':'warn'});

  checks.push({label:'Win Rate (positions)',detail:s.wins+'W/'+s.losses+'L = '+s.wr.toFixed(1)+'%',status:s.wr>=55?'ok':s.wr>=40?'warn':'fail'});
  checks.push({label:'Risk:Reward',detail:'Avg R:R = '+s.rr.toFixed(2)+' | Win $'+s.avgWin.toFixed(2)+' / Loss $'+s.avgLoss.toFixed(2),status:s.rr>=1?'ok':s.rr>=0.7?'warn':'fail'});

  var compRate = db.daily.length ? Math.round(targetHitDays/db.daily.length*100) : 0;
  checks.push({label:'Compound Target Rate',detail:targetHitDays+'/'+db.daily.length+' days hit ('+compRate+'%)',status:compRate>=60?'ok':compRate>=40?'warn':'fail'});

  if(hourData.length>=3) {
    var worstH = hourData.reduce(function(a,b){return b.pnl<a.pnl?b:a;});
    checks.push({label:'Worst Hour',detail:worstH.hour+':00 UTC ('+fmtPnl(worstH.pnl)+', '+worstH.trades+'t)',status:worstH.pnl<-15?'warn':'ok'});
  }

  checks.push({label:'Exit Mix',detail:'TP:'+exits.tp+' SL:'+exits.sl+' EA:'+exits.ea+' Manual:'+exits.manual,status:exits.tp>0?'ok':'warn'});

  var slDrag = exits.sl>0 ? Math.abs(exits.avgSl * exits.sl) : 0;
  var tpGain = exits.tp>0 ? exits.avgTp * exits.tp : 0;
  checks.push({label:'TP vs SL P&L balance',detail:'TP total '+fmtPnl(tpGain)+' vs SL total '+fmtPnl(-slDrag),status:tpGain>slDrag?'ok':tpGain>slDrag*0.7?'warn':'fail'});

  var bigLoss = db.posData.filter(function(p){return parseFloat(p.net_profit||0)<-20;});
  if(bigLoss.length) anomalies.push({type:'error',title:bigLoss.length+' Large Loss(es) >$20',desc:bigLoss.map(function(p){return p.symbol+' '+fmtPnl(p.net_profit)+' ('+p.close_reason+')';}).join(', ')});
  var worstPair = pairs.find(function(p){return p.trades>=3&&p.pnl<-10;});
  if(worstPair) anomalies.push({type:'warn',title:worstPair.sym+' underperforming',desc:worstPair.trades+' trades, '+Math.round(worstPair.wins/worstPair.trades*100)+'% WR, P&L '+fmtPnl(worstPair.pnl)});
  if(hourData.length>0) {
    var badHours = hourData.filter(function(h){return h.pnl<-15;});
    if(badHours.length) anomalies.push({type:'warn',title:'Problem hour(s): '+badHours.map(function(h){return h.hour+':00 UTC';}).join(', '),desc:badHours.map(function(h){return h.hour+':00 ('+fmtPnl(h.pnl)+', '+h.trades+'t, '+Math.round(h.wins/h.trades*100)+'%WR)';}).join(' · ')});
  }
  if(exits.manual>0 && exits.avgManual<0) anomalies.push({type:'warn',title:'Manual closes below breakeven',desc:exits.manual+' manual closes averaging '+fmtPnl(exits.avgManual)+' — letting EA manage exits is outperforming.'});

  if(s.closed>0){
    var perfTone = s.totalPnl>0&&s.wr>=55?'good':s.totalPnl<0||s.wr<40?'bad':'warn';
    insights.push({type:perfTone,label:'Performance Summary',text:'<strong>'+s.closed+' positions</strong> from clean start — <strong>'+s.wr.toFixed(1)+'% win rate</strong>, <strong>'+fmtPnl(s.totalPnl)+' net P&L</strong> (after commission & swap). '+(s.rr>=1?'R:R '+s.rr.toFixed(2)+' — avg win $'+s.avgWin.toFixed(2)+' vs avg loss $'+Math.abs(s.avgLoss).toFixed(2)+'.':'R:R '+s.rr.toFixed(2)+' — losers currently larger than winners in dollar terms.')});
  }

  if(exits.tp+exits.sl>0){
    var slPct = Math.round(exits.sl/(exits.tp+exits.sl+exits.ea+exits.manual)*100);
    insights.push({type:slPct>65?'warn':'ok',label:'Exit Analysis',text:'TP hits: <strong>'+exits.tp+'</strong> (avg '+fmtPnl(exits.avgTp)+') · SL hits: <strong>'+exits.sl+'</strong> (avg '+fmtPnl(exits.avgSl)+') · EA closes: <strong>'+exits.ea+'</strong> (avg '+fmtPnl(exits.avgEa)+') · Manual: <strong>'+exits.manual+'</strong> (avg '+fmtPnl(exits.avgManual)+'). '+(slPct>65?'SL rate at '+slPct+'% — high but avg SL loss is controlled.':'Exit mix is healthy.')});
  }

  if(db.signals.length>0){
    var topBR = Object.entries(blockReasons).sort(function(a,b){return b[1]-a[1];})[0];
    insights.push({type:openRate<10?'warn':'ok',label:'Signal Quality',text:'<strong>'+db.signals.length+' signals</strong> generated since clean start — '+openRate+'% opened, '+(100-openRate)+'% blocked. '+(topBR?'Most common block: <strong>'+topBR[0]+'</strong> ('+topBR[1]+' times). ':'')+' Note: signals table captures only a subset of actual entries — '+s.closed+' positions opened vs '+s.opened+' signals pushed.'});
  }

  if(pairs.length>0){
    var best=pairs[0], worst=pairs[pairs.length-1];
    insights.push({type:worst.pnl<-15?'warn':'ok',label:'Pair Performance',text:'Best: <strong>'+best.sym+'</strong> ('+best.trades+'t, '+Math.round(best.wins/best.trades*100)+'%WR, '+fmtPnl(best.pnl)+').'+(pairs.length>1?' Weakest: <strong>'+worst.sym+'</strong> ('+worst.trades+'t, '+Math.round(worst.wins/worst.trades*100)+'%WR, '+fmtPnl(worst.pnl)+').':'')+' GBP pairs leading — CHF crosses also consistently positive.'});
  }

  if(hourData.length>=3){
    var topH=hourData.slice().sort(function(a,b){return b.pnl-a.pnl;}).slice(0,3);
    var botH=hourData.filter(function(h){return h.pnl<-10;});
    insights.push({type:botH.length?'warn':'ok',label:'Hour of Day Pattern',text:'Best UTC hours: <strong>'+topH.map(function(h){return h.hour+':00 ('+fmtPnl(h.pnl)+', '+h.trades+'t)';}).join(' · ')+'</strong>.'+(botH.length?' Problem hours: <strong>'+botH.map(function(h){return h.hour+':00 ('+fmtPnl(h.pnl)+')';}).join(', ')+'</strong>. Consider Phase 3 time filter.':'')});
  }

  if(db.daily.length>0){
    var lastD = db.daily[db.daily.length-1];
    var endBal = lastD ? parseFloat(lastD.end_balance||0) : 0;
    var startBal = db.daily[0] ? parseFloat(db.daily[0].start_balance||0) : 0;
    var growth = startBal ? ((endBal-startBal)/startBal*100) : 0;
    insights.push({type:compRate>=60?'good':compRate>=40?'warn':'bad',label:'Compound Progress',text:'Day <strong>'+(lastD&&lastD.compound_day||'?')+'</strong>, balance <strong>£'+endBal.toFixed(2)+'</strong>. Target hit <strong>'+targetHitDays+'/'+db.daily.length+' days ('+compRate+'%)</strong>.'+(startBal?' Account grown <strong>'+(growth>=0?'+':'')+growth.toFixed(1)+'%</strong> since Day 1.':'')});
  }

  var recs = [];
  if(s.wr<55) recs.push('Win rate '+s.wr.toFixed(1)+'% — below 55% target. Consider raising InpMinStrengthGap to filter weak entries.');
  if(s.rr<1) recs.push('R:R '+s.rr.toFixed(2)+' below 1:1 — avg win $'+s.avgWin.toFixed(2)+' vs avg loss $'+Math.abs(s.avgLoss).toFixed(2)+'. Review ADR-based SL/TP settings.');
  if(exits.manual>0&&exits.avgManual<0) recs.push('Stop manual closing — EA-managed exits averaging '+fmtPnl(exits.avgEa>0?exits.avgEa:exits.avgTp)+' vs manual '+fmtPnl(exits.avgManual)+'.');
  if(hourData.length>0){var badH2=hourData.filter(function(h){return h.pnl<-10;});if(badH2.length) recs.push('Problem hours '+badH2.map(function(h){return h.hour+':00 UTC';}).join(', ')+' — flag for Phase 3 time filter consideration.');}
  var worstPR=pairs.find(function(p){return p.trades>=3&&p.pnl<-10;});
  if(worstPR) recs.push(worstPR.sym+' dragging ('+worstPR.trades+'t, '+Math.round(worstPR.wins/worstPR.trades*100)+'%WR, '+fmtPnl(worstPR.pnl)+') — flag for Phase 3 pair review.');
  if(recs.length===0) recs.push('v3.67 clean data looking healthy — maintain current settings and accumulate more trades before Phase 3 changes.');
  insights.push({type:'blue',label:'Actionable Recommendations',recs:recs});
}

function setTab(id,btn) {
  activeTab=id;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  if(btn) btn.classList.add('active');
  else{
    var map=['overview','analysis','hour','pairs','exits','positions','signals','compound','snapshot','anomalies'];
    var idx=map.indexOf(id);
    var tabs=document.querySelectorAll('.tab');
    if(idx>=0) tabs[idx].classList.add('active');
  }
  render();
}

function render() {
  if(!db.posData.length&&!db.signals.length) return;
  var c=document.getElementById('mainContent');
  if(activeTab==='overview')   c.innerHTML=renderOverview();
  else if(activeTab==='analysis')  c.innerHTML=renderAnalysis();
  else if(activeTab==='hour')      c.innerHTML=renderHourOfDay();
  else if(activeTab==='pairs')     c.innerHTML=renderPairPerformance();
  else if(activeTab==='exits')     c.innerHTML=renderExitAnalysis();
  else if(activeTab==='positions') c.innerHTML=renderPositions();
  else if(activeTab==='signals')   c.innerHTML=renderSignals();
  else if(activeTab==='compound')  c.innerHTML=renderCompound();
  else if(activeTab==='snapshot')  c.innerHTML=renderSnapshot();
  else if(activeTab==='anomalies') c.innerHTML=renderAnomalies();
}

  h+='</div>';

function renderHourOfDay() {
  var hourData=getHourStats();
  if(!hourData.length) return '<div class="empty"><p>No positions in selected date range</p></div>';
  var maxAbs=Math.max.apply(null,hourData.map(function(h){return Math.abs(h.pnl);}));
  if(maxAbs===0) maxAbs=1;
  var bestH=hourData.reduce(function(a,b){return b.pnl>a.pnl?b:a;});
  var worstH=hourData.reduce(function(a,b){return b.pnl<a.pnl?b:a;});
  var totalTrades=hourData.reduce(function(a,h){return a+h.trades;},0);
  var totalPnl=hourData.reduce(function(a,h){return a+h.pnl;},0);

  var h='<div class="grid4" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Best Hour (UTC)</div><div class="kpi-val green">'+bestH.hour+':00</div><div class="kpi-sub">'+fmtPnl(bestH.pnl)+' · '+bestH.trades+'t · '+Math.round(bestH.wins/bestH.trades*100)+'%WR</div></div>';
  h+='<div class="card"><div class="card-title">Worst Hour (UTC)</div><div class="kpi-val red">'+worstH.hour+':00</div><div class="kpi-sub">'+fmtPnl(worstH.pnl)+' · '+worstH.trades+'t · '+Math.round(worstH.wins/worstH.trades*100)+'%WR</div></div>';
  h+='<div class="card"><div class="card-title">Active Hours</div><div class="kpi-val cyan">'+hourData.length+'</div><div class="kpi-sub">of 24 · '+totalTrades+' positions</div></div>';
  h+='<div class="card"><div class="card-title">Total P&amp;L</div><div class="kpi-val '+(totalPnl>=0?'green':'red')+'">'+fmtPnl(totalPnl)+'</div><div class="kpi-sub">across all hours</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-title">P&amp;L by Hour Opened (UTC — broker chart time = UTC+3)</div><div class="hour-chart">';
  for(var hh=0;hh<24;hh++) {
    var hd=null;
    for(var xx=0;xx<hourData.length;xx++){if(hourData[xx].hour===hh){hd=hourData[xx];break;}}
    var lbl=(hh<10?'0':'')+hh+':00';
    h+='<div class="hour-row"><div class="hour-label">'+lbl+'</div><div class="hour-bar-wrap">';
    if(hd){
      var pct=Math.max(2,Math.round(Math.abs(hd.pnl)/maxAbs*75));
      var col=hd.pnl>=0?'var(--green)':'var(--red)';
      var wr=Math.round(hd.wins/hd.trades*100);
      h+='<div class="hour-bar" style="width:'+pct+'%;background:'+col+'">'+(pct>15?fmtPnl(hd.pnl):'')+'</div>';
      h+='<div class="hour-stats">'+fmtPnl(hd.pnl)+' | '+hd.trades+'t | '+wr+'%WR</div>';
    } else h+='<div style="font-size:11px;color:#cbd5e1">— no positions</div>';
    h+='</div></div>';
  }
  h+='</div></div>';

  var goodH=hourData.filter(function(x){return x.pnl>0;}).sort(function(a,b){return b.pnl-a.pnl;});
  var badH=hourData.filter(function(x){return x.pnl<0;}).sort(function(a,b){return a.pnl-b.pnl;});
  h+='<div class="card"><div class="card-title">Hour Summary</div>';
  if(goodH.length) h+='<div style="margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:var(--green)">WINNING: </span>'+goodH.map(function(x){return '<strong>'+x.hour+':00</strong> ('+fmtPnl(x.pnl)+', '+x.trades+'t, '+Math.round(x.wins/x.trades*100)+'%WR)';}).join(' · ')+'</div>';
  if(badH.length) h+='<div style="margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:var(--red)">PROBLEM: </span>'+badH.map(function(x){return '<strong>'+x.hour+':00</strong> ('+fmtPnl(x.pnl)+', '+x.trades+'t, '+Math.round(x.wins/x.trades*100)+'%WR)';}).join(' · ')+'</div>';
  h+='<div style="font-size:11px;color:var(--sub);padding-top:8px;border-top:1px solid var(--border)">UTC+3 = broker chart time · Patterns strengthen after 50+ positions — treat as directional only at this sample size.</div>';
  h+='</div>';
  return h;
}

function renderPairPerformance() {
  var pairs=getPairStats();
  if(!pairs.length) return '<div class="empty"><p>No positions yet</p></div>';
  var maxAbs=Math.max.apply(null,pairs.map(function(p){return Math.abs(p.pnl);}));
  if(maxAbs===0) maxAbs=1;
  var profPairs=pairs.filter(function(p){return p.pnl>0;}).length;
  var totalT=pairs.reduce(function(a,p){return a+p.trades;},0);

  var h='<div class="grid4" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Pairs Traded</div><div class="kpi-val">'+pairs.length+'</div><div class="kpi-sub">'+profPairs+' profitable / '+(pairs.length-profPairs)+' losing</div></div>';
  h+='<div class="card"><div class="card-title">Best Pair</div><div class="kpi-val green">'+pairs[0].sym+'</div><div class="kpi-sub">'+fmtPnl(pairs[0].pnl)+' · '+Math.round(pairs[0].wins/pairs[0].trades*100)+'%WR</div></div>';
  h+='<div class="card"><div class="card-title">Worst Pair</div><div class="kpi-val red">'+pairs[pairs.length-1].sym+'</div><div class="kpi-sub">'+fmtPnl(pairs[pairs.length-1].pnl)+' · '+Math.round(pairs[pairs.length-1].wins/pairs[pairs.length-1].trades*100)+'%WR</div></div>';
  h+='<div class="card"><div class="card-title">Total Positions</div><div class="kpi-val">'+totalT+'</div><div class="kpi-sub">across '+pairs.length+' pairs</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-title">Net P&amp;L by Pair (positions table)</div>';
  pairs.forEach(function(p){
    var wr=Math.round(p.wins/p.trades*100);
    var pct=Math.max(2,Math.round(Math.abs(p.pnl)/maxAbs*100));
    h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
    h+='<span style="font-size:12px;font-weight:700;color:#1e293b">'+p.sym+'</span>';
    h+='<div style="display:flex;gap:12px"><span style="font-size:11px;color:var(--sub)">'+p.trades+'t</span><span style="font-size:11px;color:var(--sub)">'+wr+'%WR</span><span style="font-size:12px;font-weight:700;color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(p.pnl)+'</span></div>';
    h+='</div><div class="progress"><div class="progress-bar" style="width:'+pct+'%;background:'+(p.pnl>=0?'var(--green)':'var(--red)')+'"></div></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="card-title">Pair Detail Table</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Pair</th><th>Trades</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th>Net P&amp;L</th><th>Avg Win</th><th>Avg Loss</th><th>R:R</th></tr></thead><tbody>';
  pairs.forEach(function(p){
    var wr=Math.round(p.wins/p.trades*100);
    var avgW=p.wins?p.winPnl/p.wins:0;
    var avgL=p.losses?p.lossPnl/p.losses:0;
    var rr=avgL?Math.abs(avgW/avgL):(avgW>0?99:0);
    h+='<tr>';
    h+='<td style="font-weight:700;color:var(--blue)">'+p.sym+'</td>';
    h+='<td>'+p.trades+'</td>';
    h+='<td style="color:var(--green)">'+p.wins+'</td>';
    h+='<td style="color:var(--red)">'+p.losses+'</td>';
    h+='<td><span style="font-weight:700;color:'+(wr>=55?'var(--green)':'var(--red)')+'">'+wr+'%</span></td>';
    h+='<td style="font-weight:700;color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(p.pnl)+'</td>';
    h+='<td style="color:var(--green)">'+(p.wins?fmtPnl(avgW):'—')+'</td>';
    h+='<td style="color:var(--red)">'+(p.losses?fmtPnl(avgL):'—')+'</td>';
    h+='<td style="color:'+(rr>=1?'var(--green)':'var(--gold))+'">'+(p.losses?rr.toFixed(2):'∞')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderExitAnalysis() {
  var exits=getExitStats();
  var total=exits.tp+exits.sl+exits.ea+exits.manual;
  if(total===0) return '<div class="empty"><p>No closed positions yet</p></div>';

  var h='<div class="grid4" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">TP Hits</div><div class="kpi-val green">'+exits.tp+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgTp)+'</div></div>';
  h+='<div class="card"><div class="card-title">SL Hits</div><div class="kpi-val red">'+exits.sl+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgSl)+'</div></div>';
  h+='<div class="card"><div class="card-title">EA Closes</div><div class="kpi-val cyan">'+exits.ea+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgEa)+'</div></div>';
  h+='<div class="card"><div class="card-title">Manual Closes</div><div class="kpi-val gold">'+exits.manual+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgManual)+'</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-title">Exit Distribution</div>';
  var bars=[
    {label:'TP Hits',count:exits.tp,col:'var(--green)',avg:exits.avgTp},
    {label:'SL Hits',count:exits.sl,col:'var(--red)',avg:exits.avgSl},
    {label:'EA Close',count:exits.ea,col:'var(--cyan)',avg:exits.avgEa},
    {label:'Manual Close',count:exits.manual,col:'var(--gold)',avg:exits.avgManual}
  ];
  bars.filter(function(b){return b.count>0;}).forEach(function(b){
    var pct=Math.round(b.count/total*100);
    h+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;font-weight:700;color:#1e293b">'+b.label+'</span><span style="font-size:12px;color:'+b.col+'">'+b.count+' ('+pct+'%) · avg '+fmtPnl(b.avg)+'</span></div><div class="progress" style="height:10px"><div class="progress-bar" style="width:'+pct+'%;background:'+b.col+'"></div></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="card-title">Position Log (most recent 60)</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Opened</th><th>Closed</th><th>Symbol</th><th>Dir</th><th>Lot</th><th>Net P&amp;L</th><th>Exit</th><th>Commission</th></tr></thead><tbody>';
  exits.allPos.slice().reverse().slice(0,60).forEach(function(p){
    var n=parseFloat(p.net_profit||0);
    var ec,et;
    if(p.close_reason==='tp'){et='TP Hit';ec='exit-tp';}
    else if(p.close_reason==='sl'){et='SL Hit';ec='exit-sl';}
    else if(p.close_reason==='ea'){et='EA Close';ec='exit-ea';}
    else{et='Manual';ec='exit-manual';}
    h+='<tr>';
    h+='<td style="color:var(--sub);font-size:11px">'+(p.open_time||'').slice(0,16)+'</td>';
    h+='<td style="color:var(--sub);font-size:11px">'+(p.close_time||'').slice(0,16)+'</td>';
    h+='<td style="color:var(--blue);font-weight:700">'+(p.symbol||'—')+'</td>';
    h+='<td><span class="badge-'+(p.direction||'').toLowerCase()+'">'+(p.direction||'—')+'</span></td>';
    h+='<td>'+(p.lot||'—')+'</td>';
    h+='<td style="font-weight:700;color:'+(n>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(n)+'</td>';
    h+='<td><span class="'+ec+'">'+et+'</span></td>';
    h+='<td style="color:var(--sub);font-size:11px">'+parseFloat(p.commission||0).toFixed(2)+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderPositions() {
  var pos=db.posData.slice().reverse();
  var pairs=getPairStats();
  var maxAbs=Math.max.apply(null,pairs.map(function(p){return Math.abs(p.pnl);}).concat([1]));

  var h='<div class="grid2" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">P&amp;L by Pair</div>';
  pairs.slice(0,12).forEach(function(p){
    var wr=Math.round(p.wins/p.trades*100);
    var pct=Math.max(2,Math.round(Math.abs(p.pnl)/maxAbs*100));
    h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><span style="font-size:12px;font-weight:700;color:#1e293b">'+p.sym+'</span><div style="display:flex;gap:8px"><span style="font-size:11px;color:var(--sub)">'+wr+'%WR</span><span style="font-size:12px;font-weight:700;color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(p.pnl)+'</span></div></div><div class="progress"><div class="progress-bar" style="width:'+pct+'%;background:'+(p.pnl>=0?'var(--green)':'var(--red)')+'"></div></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="card-title">Open Positions (from trades table)</div><div class="tbl-wrap" style="max-height:280px"><table><thead><tr><th>Symbol</th><th>Dir</th><th>Lot</th><th>Entry</th><th>Opened</th></tr></thead><tbody>';
  if(db.trades.length){
    db.trades.forEach(function(t){h+='<tr><td style="color:var(--blue);font-weight:700">'+(t.symbol||'—')+'</td><td><span class="badge-'+(t.direction||'').toLowerCase()+'">'+(t.direction||'—')+'</span></td><td>'+(t.lot||'—')+'</td><td>'+parseFloat(t.entry||0).toFixed(5)+'</td><td style="color:var(--sub);font-size:11px">'+(t.ts||'').slice(0,16)+'</td></tr>';});
  } else h+='<tr><td colspan="5" style="color:var(--sub);text-align:center">No open positions</td></tr>';
  h+='</tbody></table></div></div></div>';

  h+='<div class="card"><div class="card-title">All Positions — clean start ('+pos.length+' total)</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Opened</th><th>Symbol</th><th>Dir</th><th>Lot</th><th>Net P&amp;L</th><th>Gross</th><th>Comm</th><th>Exit</th><th>Close Time</th></tr></thead><tbody>';
  pos.slice(0,100).forEach(function(p){
    var n=parseFloat(p.net_profit||0);
    var ec=p.close_reason==='tp'?'exit-tp':p.close_reason==='sl'?'exit-sl':p.close_reason==='ea'?'exit-ea':'exit-manual';
    h+='<tr>';
    h+='<td style="color:var(--sub);font-size:11px">'+(p.open_time||'').slice(0,16)+'</td>';
    h+='<td style="color:var(--blue);font-weight:700">'+(p.symbol||'—')+'</td>';
    h+='<td><span class="badge-'+(p.direction||'').toLowerCase()+'">'+(p.direction||'—')+'</span></td>';
    h+='<td>'+(p.lot||'—')+'</td>';
    h+='<td style="font-weight:700;color:'+(n>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(n)+'</td>';
    h+='<td style="color:var(--sub)">'+parseFloat(p.profit||0).toFixed(2)+'</td>';
    h+='<td style="color:var(--sub)">'+parseFloat(p.commission||0).toFixed(2)+'</td>';
    h+='<td><span class="'+ec+'">'+(p.close_reason||'—')+'</span></td>';
    h+='<td style="color:var(--sub);font-size:11px">'+(p.close_time||'').slice(0,16)+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderSignals() {
  var sigs=db.signals.slice().reverse().slice(0,200);
  var blockReasons={};
  db.signals.filter(function(s){return s.result==='BLOCKED';}).forEach(function(s){var r=s.block_reason||'Unknown';blockReasons[r]=(blockReasons[r]||0)+1;});
  var sortedR=Object.entries(blockReasons).sort(function(a,b){return b[1]-a[1];});
  var totalBl=db.signals.filter(function(s){return s.result==='BLOCKED';}).length;

  var h='<div class="grid2" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Block Reason Breakdown</div>';
  sortedR.slice(0,8).forEach(function(e){
    var pct=totalBl?Math.round(e[1]/totalBl*100):0;
    h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:#1e293b">'+e[0]+'</span><span style="color:var(--gold)">'+e[1]+' ('+pct+'%)</span></div><div class="progress"><div class="progress-bar" style="width:'+pct+'%;background:var(--gold)"></div></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="card-title">Gap Distribution (Opened Signals)</div>';
  var gmap={};
  db.signals.filter(function(s){return s.result==='OPENED';}).forEach(function(s){var g=(Math.floor(parseFloat(s.gap||0)*5)/5).toFixed(1);if(!gmap[g])gmap[g]=0;gmap[g]++;});
  var gE=Object.entries(gmap).sort(function(a,b){return parseFloat(a[0])-parseFloat(b[0]);});
  var gMx=Math.max.apply(null,gE.map(function(e){return e[1];}).concat([1]));
  gE.forEach(function(e){h+='<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--sub)">&ge;'+e[0]+'</span><span style="color:var(--green)">'+e[1]+'</span></div><div class="progress"><div class="progress-bar" style="width:'+Math.round(e[1]/gMx*100)+'%;background:var(--green)"></div></div></div>';});
  h+='<div style="margin-top:12px;padding:10px;background:#fef3c7;border-radius:6px;font-size:11px;color:#92400e">Note: signals table is a partial record — only '+db.signals.length+' signals pushed vs '+db.posData.length+' positions. Positions table is source of truth for trade stats.</div>';
  h+='</div></div>';

  h+='<div class="card"><div class="card-title">Recent Signals (last 200)</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Strong</th><th>Weak</th><th>Gap</th><th>Result</th><th>Block Reason</th></tr></thead><tbody>';
  sigs.forEach(function(s){h+='<tr><td style="color:var(--sub)">'+(s.ts||'').slice(0,16)+'</td><td style="color:var(--blue);font-weight:700">'+(s.symbol||'—')+'</td><td><span class="badge-'+(s.direction||'').toLowerCase()+'">'+(s.direction||'—')+'</span></td><td style="color:var(--green)">'+(s.strong_cur||'—')+'</td><td style="color:var(--red)">'+(s.weak_cur||'—')+'</td><td>'+parseFloat(s.gap||0).toFixed(4)+'</td><td><span class="'+(s.result==='OPENED'?'badge-buy':'badge-blocked')+'">'+(s.result||'—')+'</span></td><td style="color:var(--sub);font-size:11px">'+(s.block_reason||'—')+'</td></tr>';});
  h+='</tbody></table></div></div>';
  return h;
}

function renderCompound() {
  var days=db.daily.slice().sort(function(a,b){return a.date>b.date?1:-1;});
  var lastDay=days.length?days[days.length-1]:null;
  var targetHit=days.filter(function(d){return d.target_hit;}).length;
  var totalPnl=days.reduce(function(a,d){return a+parseFloat(d.daily_pnl||0);},0);
  var startBal=days.length?parseFloat(days[0].start_balance||0):0;
  var endBal=lastDay?parseFloat(lastDay.end_balance||0):0;
  var growth=startBal?((endBal-startBal)/startBal*100):0;

  var h='<div class="grid5" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Current Day</div><div class="kpi-val cyan">'+(lastDay?lastDay.compound_day:'—')+'</div><div class="kpi-sub">'+(lastDay?lastDay.date:'')+'</div></div>';
  h+='<div class="card"><div class="card-title">Balance</div><div class="kpi-val green">£'+(lastDay?endBal.toFixed(2):'—')+'</div><div class="kpi-sub">End of last session</div></div>';
  h+='<div class="card"><div class="card-title">Growth</div><div class="kpi-val '+(growth>=0?'green':'red')+'">'+(growth>=0?'+':'')+growth.toFixed(1)+'%</div><div class="kpi-sub">Since Day 1</div></div>';
  h+='<div class="card"><div class="card-title">Target Hit</div><div class="kpi-val gold">'+targetHit+'/'+days.length+'</div><div class="kpi-sub">'+(days.length?Math.round(targetHit/days.length*100):0)+'% rate</div></div>';
  h+='<div class="card"><div class="card-title">Total P&amp;L</div><div class="kpi-val '+(totalPnl>=0?'green':'red')+'">'+fmtPnl(totalPnl)+'</div><div class="kpi-sub">Across '+days.length+' days</div></div>';
  h+='</div>';

  h+='<div class="card"><div class="card-title">Daily Log</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Date</th><th>Day</th><th>Start</th><th>End</th><th>P&amp;L</th><th>Target</th><th>Lot</th><th>Result</th></tr></thead><tbody>';
  days.slice().reverse().forEach(function(d){
    var pnl=parseFloat(d.daily_pnl||0);
    h+='<tr><td style="color:var(--sub)">'+d.date+'</td><td style="color:var(--cyan);font-weight:700">'+d.compound_day+'</td><td>£'+parseFloat(d.start_balance||0).toFixed(2)+'</td><td>£'+parseFloat(d.end_balance||0).toFixed(2)+'</td><td style="color:'+(pnl>=0?'var(--green)':'var(--red)')+';font-weight:700">'+fmtPnl(pnl)+'</td><td style="color:var(--gold)">£'+parseFloat(d.compound_target||0).toFixed(2)+'</td><td>'+(d.compound_lot||'—')+'</td><td><span class="pill '+(d.target_hit?'pill-g':'pill-r')+'">'+(d.target_hit?'HIT':'MISS')+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderSnapshot() {
  var sigs=db.signals.filter(function(s){return s.currency_snapshot;}).slice(-50).reverse();
  if(!sigs.length) return '<div class="empty"><div style="font-size:36px;margin-bottom:10px">📊</div><p>No snapshot data — requires EA v3.55+</p></div>';
  var latest=sigs[0].currency_snapshot;
  var snap=typeof latest==='string'?JSON.parse(latest):latest;
  var curs=Object.entries(snap).sort(function(a,b){return a[1]-b[1];});

  var h='<div class="card" style="margin-bottom:16px"><div class="card-title">Latest Snapshot — '+(sigs[0].ts||'').slice(0,16)+'</div><div class="snap-grid">';
  curs.forEach(function(e){
    var cur=e[0],val=parseFloat(e[1]);
    var col=val<-0.3?'var(--green)':val>0.3?'var(--red)':'var(--sub)';
    var zone=val<-0.3?'STRONG':val>0.3?'WEAK':'NEUTRAL';
    h+='<div class="snap-item"><div class="snap-cur">'+cur+'</div><div class="snap-val" style="color:'+col+'">'+(val>0?'+':'')+val.toFixed(4)+'</div><div style="font-size:10px;color:'+col+';margin-top:2px">'+zone+'</div></div>';
  });
  h+='</div></div>';

  h+='<div class="card"><div class="card-title">Snapshot History</div><div class="tbl-wrap"><table>';
  h+='<thead><tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Result</th><th>EUR</th><th>GBP</th><th>AUD</th><th>NZD</th><th>USD</th><th>CAD</th><th>CHF</th><th>JPY</th></tr></thead><tbody>';
  sigs.forEach(function(s){
    var sk=s.currency_snapshot?(typeof s.currency_snapshot==='string'?JSON.parse(s.currency_snapshot):s.currency_snapshot):{};
    function fv(v){if(v===undefined)return '—';var n=parseFloat(v);var col=n<-0.3?'var(--green)':n>0.3?'var(--red)':'var(--sub)';return '<span style="color:'+col+'">'+(n>0?'+':'')+n.toFixed(3)+'</span>';}
    h+='<tr><td style="color:var(--sub);font-size:11px">'+(s.ts||'').slice(0,16)+'</td><td style="color:var(--blue);font-weight:700">'+(s.symbol||'—')+'</td><td><span class="badge-'+(s.direction||'').toLowerCase()+'">'+(s.direction||'—')+'</span></td><td><span class="'+(s.result==='OPENED'?'badge-buy':'badge-blocked')+'">'+(s.result||'—')+'</span></td>'+['EUR','GBP','AUD','NZD','USD','CAD','CHF','JPY'].map(function(c){return '<td>'+fv(sk[c])+'</td>';}).join('')+'</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderAnomalies() {
  var h='<div style="margin-bottom:16px">';
  if(!anomalies.length) h+='<div class="empty"><div style="font-size:36px;margin-bottom:10px">✅</div><p style="color:var(--green);font-weight:700">No anomalies detected</p></div>';
  else anomalies.forEach(function(a){h+='<div class="anomaly-item '+(a.type==='warn'?'aw':'')+'"><div class="anomaly-title">'+(a.type==='warn'?'⚠ ':'🚨 ')+a.title+'</div><div class="anomaly-desc">'+a.desc+'</div></div>';});
  h+='</div>';
  h+='<div class="card"><div class="card-title">All Health Checks</div>';
  checks.forEach(function(c){h+='<div class="check-row"><div class="check-icon '+siCls(c.status)+'">'+siIcon(c.status)+'</div><div class="check-label">'+c.label+'</div><div class="check-detail">'+c.detail+'</div></div>';});
  h+='</div>';
  return h;
}

(async function(){
  try {
    var accts=await sb('accounts','select=id,label,account_number&strategy=eq.CSEA&order=label');
    var sel=document.getElementById('acctSelect');
    sel.innerHTML='<option value="">All CSEA Accounts</option>';
    accts.forEach(function(a){var o=document.createElement('option');o.value=a.id;o.textContent=a.label||a.account_number;sel.appendChild(o);});
    if(accts.length){sel.value=accts[0].id;acctId=accts[0].id;}
    sel.onchange=function(){acctId=this.value;};
  } catch(e){console.error('Init:',e);}
})();
</script>
