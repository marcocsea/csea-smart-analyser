<style>

.lbl{font-size:11px;color:#64748b}

button{padding:7px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}

.tabs{background:#ffffff;border-bottom:2px solid #e2e8f0;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;transition:all .15s;white-space:nowrap}

.tab.active.gtmo-tab{color:#d97706;border-bottom-color:#d97706}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}

.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.cyan{color:var(--cyan)}.blue{color:var(--blue)}

<script>

];

async function sb(table, params) {
  var PAGE = 1000, all = [], from = 0;
  while(true) {
    var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + params + '&limit=' + PAGE + '&offset=' + from, {
      headers: Object.assign({}, HDR, {'Range-Unit':'items','Range':from+'-'+(from+PAGE-1)})
    });
    if(!r.ok) break;
    var pg = await r.json();
    all = all.concat(pg);
    if(pg.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

function todayStr() { return new Date().toISOString().slice(0,10); }
function sevenDaysAgoStr() { var d = new Date(); d.setDate(d.getDate() - 7); return d.toISOString().slice(0,10); }

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('modeCsea').className = 'mode-btn' + (mode==='csea'?' active':'');
  document.getElementById('modeGtmo').className = 'mode-btn' + (mode==='gtmo'?' active':'');
  document.getElementById('toolbarCsea').style.display = mode==='csea' ? '' : 'none';
  document.getElementById('toolbarGtmo').style.display = mode==='gtmo' ? '' : 'none';
  document.getElementById('tabBar').style.display = mode==='csea' ? '' : 'none';
  document.getElementById('gtmoTabBar').style.display = mode==='gtmo' ? '' : 'none';

  }
}

var GP_ACCT_ID = '42b3b312-1cb6-401b-b94a-9b462df44702';

function buildGPSessions(trades) {
  var opens = trades.filter(function(t){ return t.event === 'OPEN'; });
  var closes = trades.filter(function(t){ return t.event === 'CLOSE'; });
  if(!opens.length) return [];
  var sessionGroups = [];
  var sorted = opens.slice().sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  var GAP_MS = 5000;
  var curGroup = [sorted[0]];
  for(var i = 1; i < sorted.length; i++) {
    var prev = new Date(sorted[i-1].ts);
    var curr = new Date(sorted[i].ts);
    var sameDir = sorted[i].direction === sorted[i-1].direction;
    if(curr - prev <= GAP_MS && sameDir) { curGroup.push(sorted[i]); }
    else { sessionGroups.push(curGroup); curGroup = [sorted[i]]; }
  }

function getStats(){var pos=db.posData;var wins=pos.filter(function(p){return parseFloat(p.net_profit||0)>0;});var losses=pos.filter(function(p){return parseFloat(p.net_profit||0)<0;});var totalPnl=pos.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0);var avgWin=wins.length?wins.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0)/wins.length:0;var avgLoss=losses.length?losses.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0)/losses.length:0;var rr=avgLoss?Math.abs(avgWin/avgLoss):0;var opened=db.signals.filter(function(s){return s.result==='OPENED';}).length;var lastDaily=db.daily.length?db.daily[db.daily.length-1]:null;var openPos=db.trades.filter(function(t){return t.event==='OPEN';}).length;return{closed:pos.length,wins:wins.length,losses:losses.length,wr:pos.length?wins.length/pos.length*100:0,totalPnl:totalPnl,avgWin:avgWin,avgLoss:avgLoss,rr:rr,opened:opened,blocked:db.signals.length-opened,positions:openPos,lastDaily:lastDaily};}
function getPairStats(){var map={};db.posData.forEach(function(p){var s=p.symbol||'?';if(!map[s])map[s]={sym:s,trades:0,wins:0,losses:0,pnl:0,winPnl:0,lossPnl:0};map[s].trades++;var n=parseFloat(p.net_profit||0);map[s].pnl+=n;if(n>0){map[s].wins++;map[s].winPnl+=n;}else{map[s].losses++;map[s].lossPnl+=n;}});return Object.values(map).sort(function(a,b){return b.pnl-a.pnl;});}
function getHourStats(){var map={};db.posData.forEach(function(p){if(!p.open_time)return;var h=new Date(p.open_time).getUTCHours();if(!map[h])map[h]={hour:h,trades:0,wins:0,pnl:0};map[h].trades++;var n=parseFloat(p.net_profit||0);map[h].pnl+=n;if(n>0)map[h].wins++;});var arr=[];for(var h=0;h<24;h++){if(map[h])arr.push(map[h]);}return arr;}
function getExitStats(){var pos=db.posData;var tp=pos.filter(function(p){return p.close_reason==='tp';});var sl=pos.filter(function(p){return p.close_reason==='sl';});var ea=pos.filter(function(p){return p.close_reason==='ea';});var manual=pos.filter(function(p){return p.close_reason==='manual';});function avg(arr){return arr.length?arr.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0)/arr.length:0;}return{tp:tp.length,sl:sl.length,ea:ea.length,manual:manual.length,avgTp:avg(tp),avgSl:avg(sl),avgEa:avg(ea),avgManual:avg(manual),allPos:pos};}

function runAnalysis(){checks=[];anomalies=[];insights=[];var s=getStats();var pairs=getPairStats();var hourData=getHourStats();var exits=getExitStats();var targetHitDays=db.daily.filter(function(d){return d.target_hit;}).length;var blockReasons={};db.signals.filter(function(sg){return sg.result==='BLOCKED';}).forEach(function(sg){var r=sg.block_reason||'Unknown';blockReasons[r]=(blockReasons[r]||0)+1;});var lastSig=db.signals.length?db.signals[db.signals.length-1]:null;var minsAgo=lastSig?Math.round((Date.now()-new Date(lastSig.ts))/60000):9999;checks.push({label:'Push Connectivity',detail:lastSig?'Last signal '+(minsAgo<60?minsAgo+'m':Math.round(minsAgo/60)+'h')+' ago':'No signals',status:minsAgo<180?'ok':minsAgo<600?'warn':'fail'});var openRate=db.signals.length?Math.round(s.opened/db.signals.length*100):0;checks.push({label:'Signal Open Rate',detail:s.opened+'/'+db.signals.length+' opened ('+openRate+'%)',status:openRate>3&&openRate<70?'ok':openRate===0?'fail':'warn'});checks.push({label:'Win Rate (positions)',detail:s.wins+'W/'+s.losses+'L = '+s.wr.toFixed(1)+'%',status:s.wr>=55?'ok':s.wr>=40?'warn':'fail'});checks.push({label:'Risk:Reward',detail:'Avg R:R = '+s.rr.toFixed(2),status:s.rr>=1?'ok':s.rr>=0.7?'warn':'fail'});var compRate=db.daily.length?Math.round(targetHitDays/db.daily.length*100):0;checks.push({label:'Compound Target Rate',detail:targetHitDays+'/'+db.daily.length+' days hit ('+compRate+'%)',status:compRate>=60?'ok':compRate>=40?'warn':'fail'});checks.push({label:'Exit Mix',detail:'TP:'+exits.tp+' SL:'+exits.sl+' EA:'+exits.ea+' Manual:'+exits.manual,status:exits.tp>0?'ok':'warn'});if(s.closed>0){insights.push({type:s.totalPnl>0&&s.wr>=55?'good':s.totalPnl<0||s.wr<40?'bad':'warn',label:'Performance Summary',text:'<strong>'+s.closed+' positions</strong> — <strong>'+s.wr.toFixed(1)+'% win rate</strong>, <strong>'+fmtPnl(s.totalPnl)+' net P&L</strong>.'});}var recs=[];if(s.wr<55)recs.push('Win rate '+s.wr.toFixed(1)+'% — below 55% target.');if(s.rr<1 function renderAnalysis(){var passC=checks.filter(function(c){return c.status==='ok';}).length,hPct=checks.length?Math.round(passC/checks.length*100):0,hCol=hPct>=80?'var(--green)':hPct>=50?'var(--gold)':'var(--red)',recI=null,mainI=[];insights.forEach(function(i){if(i.recs)recI=i;else mainI.push(i);});var h='<div class="analysis-panel"><div class="analysis-header"><div class="analysis-icon">🧠</div><div><div class="analysis-title">Smart Analysis Report</div><div class="analysis-subtitle">Powered by positions table</div></div><div style="margin-left:auto"><div class="score-ring"><div class="score-circle" style="color:'+hCol+';border-color:'+hCol+'">'+hPct+'%</div><div><div style="font-size:12px;font-weight:700">System Health</div><div style="font-size:11px;color:var(--sub)">'+passC+'/'+checks.length+' checks passing</div></div></div></div></div>';mainI.forEach(function(i){var cls=i.type==='good'?'good':i.type==='bad'?'bad':i.type==='warn'?'warn':'';h+='<div class="insight-block '+cls+'"><div class="insight-label">'+i.label+'</div><div class="insight-text">'+i.text+'</div></div>';});if(recI){h+='<div class="insight-block" style="border-left-color:var(--cyan)"><div class="insight-label" style="color:var(--cyan)">'+recI.label+'</div><ul class="rec-list">';recI.recs.forEach(function(r){h+='<li>'+r+'</li>';});h+='</ul></div>';}h+='</div>';if(anomalies.length){h+='<div class="card"><div class="card-title">Active Anomalies</div>';anomalies.forEach(function(a){h+='<div class="anomaly-item '+(a.type==='warn'?'aw':'')+'"><div class="anomaly-title">'+(a.type==='warn'?'⚠ ':'🚨 ')+a.title+'</div><div class="anomaly-desc">'+a.desc+'</div></div>';});h+='</div>';}return h;}

function renderHourOfDay(){var hourData=getHourStats();if(!hourData.length)return'<div class="empty"><p>No positions in selected date range</p></div>';var maxAbs=Math.max.apply(null,hourData.map(function(h){return Math.abs(h.pnl);}));if(maxAbs===0)maxAbs=1;var bestH=hourData.reduce(function(a,b){return b.pnl>a.pnl?b:a;}),worstH=hourData.reduce(function(a,b){return b.pnl<a.pnl?b:a;});var h='<div class="grid4" style="margin-bottom:16px"><div class="card"><div class="card-title">Best Hour (UTC)</div><div class="kpi-val green">'+bestH.hour+':00</div><div class="kpi-sub">'+fmtPnl(bestH.pnl)+'</div></div><div class="card"><div class="card-title">Worst Hour (UTC)</div><div class="kpi-val red">'+worstH.hour+':00</div><div class="kpi-sub">'+fmtPnl(worstH.pnl)+'</div></div><div class="card"><div class="card-title">Active Hours</div><div class="kpi-val cyan">'+hourData.length+'</div></div><div class="card"><div class="card-title">Total P&L</div><div class="kpi-val '+(hourData.reduce(function(a,h){return a+h.pnl;},0)>=0?'green':'red')+'">'+fmtPnl(hourData.reduce(function(a,h){return a+h.pnl;},0))+'</div></div></div>';h+='<div class="card"><div class="card-title">P&L by Hour (UTC)</div><div class="hour-chart">';for(var hh=0;hh<24;hh++){var hd=null;for(var xx=0;xx<hourData.length;xx++){if(hourData[xx].hour===hh){hd=hourData[xx];break;}}var lbl=(hh<10?'0':'')+hh+':00';h+='<div class="hour-row"><div class="hour-label">'+lbl+'</div><div class="hour-bar-wrap">';if(hd){var pct2=Math.max(2,Math.round(Math.abs(hd.pnl)/maxAbs*75)),col2=hd.pnl>=0?'var(--green)':'var(--red)',wr2=Math.round(hd.wins/hd.trades*100);h+='<div class="hour-bar" style="width:'+pct2+'%;background:'+col2+'">'+(pct2>15?fmtPnl(hd.pnl):'')+'</div><div class="hour-stats">'+fmtPnl(hd.pnl)+' | '+hd.trades+'t | '+wr2+'%WR</div>';}else h+='<div style="font-size:11px;color:#cbd5e1">— no positions</div>';h+='</div></div>';}h+='</div></div>';return h;}

function renderPairPerformance(){var pairs=getPairStats();if(!pairs.length)return'<div class="empty"><p>No positions yet</p></div>';var maxAbs=Math.max.apply(null,pairs.map(function(p){return Math.abs(p.pnl);}));if(maxAbs===0)maxAbs=1;var h='<div class="grid4" style="margin-bottom:16px"><div class="card"><div class="card-title">Pairs Traded</div><div class="kpi-val">'+pairs.length+'</div></div><div class="card"><div class="card-title">Best Pair</div><div class="kpi-val green">'+pairs[0].sym+'</div><div class="kpi-sub">'+fmtPnl(pairs[0].pnl)+'</div></div><div class="card"><div class="card-title">Worst Pair</div><div class="kpi-val red">'+pairs[pairs.length-1].sym+'</div><div class="kpi-sub">'+fmtPnl(pairs[pairs.length-1].pnl)+'</div></div><div class="card"><div class="card-title">Total Positions</div><div class="kpi-val">'+pairs.reduce(function(a,p){return a+p.trades;},0)+'</div></div></div>';h+='<div class="card"><div class="card-title">Net P&L by Pair</div>';pairs.forEach(function(p){var wr3=Math.round(p.wins/p.trades*100),pct3=Math.max(2,Math.round(Math.abs(p.pnl)/maxAbs*100));h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:12px;font-weight:700">'+p.sym+'</span><div style="display:flex;gap:12px"><span style="font-size:11px;color:var(--sub)">'+p.trades+'t</span><span style="font-size:11px;color:var(--sub)">'+wr3+'%WR</span><span style="font-size:12px;font-weight:700;color:'+(p.pnl>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(p.pnl)+'</span></div></div><div class="progress"><div class="progress-bar" style="width:'+pct3+'%;background:'+(p.pnl>=0?'var(--green)':'var(--red)')+'"></div></div></div>';});h+='</div>';return h;}

function renderExitAnalysis(){var exits=getExitStats(),total=exits.tp+exits.sl+exits.ea+exits.manual;if(total===0)return'<div class="empty"><p>No closed positions yet</p></div>';var h='<div class="grid4" style="margin-bottom:16px"><div class="card"><div class="card-title">TP Hits</div><div class="kpi-val green">'+exits.tp+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgTp)+'</div></div><div class="card"><div class="card-title">SL Hits</div><div class="kpi-val red">'+exits.sl+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgSl)+'</div></div><div class="card"><div class="card-title">EA Closes</div><div class="kpi-val cyan">'+exits.ea+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgEa)+'</div></div><div class="card"><div class="card-title">Manual Closes</div><div class="kpi-val gold">'+exits.manual+'</div><div class="kpi-sub">Avg '+fmtPnl(exits.avgManual)+'</div></div></div>';h+='<div class="card"><div class="card-title">Position Log (last 60)</div><div class="tbl-wrap"><table><thead><tr><th>Opened</th><th>Symbol</th><th>Dir</th><th>Lot</th><th>Net P&L</th><th>Exit</th></tr></thead><tbody>';exits.allPos.slice().reverse().slice(0,60).forEach(function(p){var n=parseFloat(p.net_profit||0);var ec=p.close_reason==='tp'?'exit-tp':p.close_reason==='sl'?'exit-sl':p.close_reason==='ea'?'exit-ea':'exit-manual';var et=p.close_reason==='tp'?'TP':p.close_reason==='sl'?'SL':p.close_reason==='ea'?'EA':'Manual';h+='<tr><td style="color:var(--sub);font-size:11px">'+(p.open_time||'').slice(0,16)+'</td><td style="color:var(--blue);font-weight:700">'+(p.symbol||'—')+'</td><td><span class="badge-'+(p.direction||'').toLowerCase()+'">'+(p.direction||'—')+'</span></td><td>'+(p.lot||'—')+'</td><td style="font-weight:700;color:'+(n>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(n)+'</td><td><span class="'+ec+'">'+et+'</span></td></tr>';});h+='</tbody></table></div></div>';return h;}

function renderPositions(){var pos=db.posData.slice().reverse();var h='<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Opened</th><th>Symbol</th><th>Dir</th><th>Lot</th><th>Net P&L</th><th>Exit</th></tr></thead><tbody>';pos.slice(0,100).forEach(function(p){var n=parseFloat(p.net_profit||0);var ec=p.close_reason==='tp'?'exit-tp':p.close_reason==='sl'?'exit-sl':p.close_reason==='ea'?'exit-ea':'exit-manual';h+='<tr><td style="color:var(--sub);font-size:11px">'+(p.open_time||'').slice(0,16)+'</td><td style="color:var(--blue);font-weight:700">'+(p.symbol||'—')+'</td><td><span class="badge-'+(p.direction||'').toLowerCase()+'">'+(p.direction||'—')+'</span></td><td>'+(p.lot||'—')+'</td><td style="font-weight:700;color:'+(n>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(n)+'</td><td><span class="'+ec+'">'+(p.close_reason||'—')+'</span></td></tr>';});h+='</tbody></table></div></div>';return h;}

function renderSignals(){var sigs=db.signals.slice().reverse().slice(0,200);var h='<div class="card"><div class="card-title">Recent Signals (last 200)</div><div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Strong</th><th>Weak</th><th>Gap</th><th>Result</th><th>Reason</th></tr></thead><tbody>';sigs.forEach(function(s){h+='<tr><td style="color:var(--sub)">'+(s.ts||'').slice(0,16)+'</td><td style="color:var(--blue);font-weight:700">'+(s.symbol||'—')+'</td><td><span class="badge-'+(s.direction||'').toLowerCase()+'">'+(s.direction||'—')+'</span></td><td style="color:var(--green)">'+(s.strong_cur||'—')+'</td><td style="color:var(--red)">'+(s.weak_cur||'—')+'</td><td>'+parseFloat(s.gap||0).toFixed(4)+'</td><td><span class="'+(s.result==='OPENED'?'badge-buy':'badge-blocked')+'">'+(s.result||'—')+'</span></td><td style="color:var(--sub);font-size:11px">'+(s.block_reason||'—')+'</td></tr>';});h+='</tbody></table></div></div>';return h;}

function renderCompound(){var days=db.daily.slice().sort(function(a,b){return a.date>b.date?1:-1;}),lastDay=days.length?days[days.length-1]:null;var h='<div class="card"><div class="card-title">Daily Log</div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Day</th><th>P&L</th><th>Target</th><th>Result</th></tr></thead><tbody>';days.slice().reverse().forEach(function(d){var pnl=parseFloat(d.daily_pnl||0);h+='<tr><td style="color:var(--sub)">'+d.date+'</td><td style="color:var(--cyan);font-weight:700">'+d.compound_day+'</td><td style="color:'+(pnl>=0?'var(--green)':'var(--red)')+';font-weight:700">'+fmtPnl(pnl)+'</td><td style="color:var(--gold)">£'+parseFloat(d.compound_target||0).toFixed(2)+'</td><td><span class="pill '+(d.target_hit?'pill-g':'pill-r')+'">'+(d.target_hit?'HIT':'MISS')+'</span></td></tr>';});h+='</tbody></table></div></div>';return h;}

function renderSnapshot(){var sigs=db.signals.filter(function(s){return s.currency_snapshot;}).slice(-50).reverse();if(!sigs.length)return'<div class="empty"><p>No snapshot data</p></div>';return'<div class="empty"><p>Snapshot data available — '+sigs.length+' records</p></div>';}

function renderAnomalies(){var h='<div style="margin-bottom:16px">';if(!anomalies.length)h+='<div class="empty"><div style="font-size:36px;margin-bottom:10px">✅</div><p style="color:var(--green);font-weight:700">No anomalies detected</p></div>';else anomalies.forEach(function(a){h+='<div class="anomaly-item '+(a.type==='warn'?'aw':'')+'"><div class="anomaly-title">'+(a.type==='warn'?'⚠ ':'🚨 ')+a.title+'</div><div class="anomaly-desc">'+a.desc+'</div></div>';});h+='</div><div class="card"><div class="card-title">All Health Checks</div>';checks.forEach(function(c){h+='<div class="check-row"><div class="check-icon '+siCls(c.status)+'">'+siIcon(c.status)+'</div><div class="check-label">'+c.label+'</div><div class="check-detail">'+c.detail+'</div></div>';});h+='</div>';return h;}

async function renderIndicatorCompare(){
  var c=document.getElementById('mainContent');
  c.innerHTML='<div class="empty"><div style="font-size:24px;margin-bottom:8px">&#9878;</div><p style="color:#1e293b;font-weight:700;margin-bottom:4px">Loading indicator comparison...</p></div>';
  var HDR2={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  var FREE_ID='20e66a96-917d-4233-ac1a-4ba39c7c806c';
  var PAID_ID='fd373385-1868-4571-8e61-d0fdc9dc17f6';
  var PAGE=1000;
  async function fetchTrades(aid){var all=[],from=0;while(true){var r=await fetch(SB_URL+'/rest/v1/trades?account_id=eq.'+aid+'&order=ts&limit='+PAGE+'&offset='+from,{headers:HDR2});var pg=await r.json();all=all.concat(pg);if(pg.length<PAGE)break;from+=PAGE;}return all;}
  var results=await Promise.all([fetchTrades(FREE_ID),fetchTrades(PAID_ID)]);
  var freeAll=results[0],paidAll=results[1];
  var freeCl=freeAll.filter(function(t){return(t.event==='CLOSE'||t.event==='COMPOUND_CLOSE')&&parseFloat(t.pnl||0)!==0;});
  var paidCl=paidAll.filter(function(t){return(t.event==='CLOSE'||t.event==='COMPOUND_CLOSE')&&parseFloat(t.pnl||0)!==0;});
  var freeOpen=freeAll.filter(function(t){return t.event==='OPEN';});
  var paidOpen=paidAll.filter(function(t){return t.event==='OPEN';});
  var agreed=[],freeOnly=[],paidOnly=[];
  freeCl.forEach(function(ft){var fd=(ft.ts||'').slice(0,10);var m=paidCl.find(function(pt){return pt.symbol===ft.symbol&&pt.direction===ft.direction&&(pt.ts||'').slice(0,10)===fd;});if(m)agreed.push({free:ft,paid:m});else freeOnly.push(ft);});
  paidCl.forEach(function(pt){var pd=(pt.ts||'').slice(0,10);if(!freeCl.find(function(ft){return ft.symbol===pt.symbol&&ft.direction===pt.direction&&(ft.ts||'').slice(0,10)===pd;}))paidOnly.push(pt);});
  var total=agreed.length+freeOnly.length+paidOnly.length;
  var agreePct=total?(agreed.length/total*100).toFixed(0):0;
  function wrOf(arr,field){if(!arr.length)return'—';var w=arr.filter(function(x){return parseFloat((field?x[field]:x).pnl||0)>0;}).length;return(w/arr.length*100).toFixed(1)+'%';}
  function avgGap(arr,field){var g=arr.map(function(x){return parseFloat((field?x[field]:x).gap||0);}).filter(function(v){return v>0;});return g.length?(g.reduce(function(a,b){return a+b;},0)/g.length).toFixed(3):'—';}
  function totPnl(arr){return arr.reduce(function(s,t){return s+parseFloat(t.pnl||0);},0);}
  var h='<div class="grid5" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Agreement Rate</div><div class="kpi-val '+(parseInt(agreePct)>=70?'green':parseInt(agreePct)>=40?'gold':'red')+'">'+agreePct+'%</div><div class="kpi-sub">'+agreed.length+' shared / '+total+' total</div></div>';
  h+='<div class="card"><div class="card-title">Both Took</div><div class="kpi-val green">'+agreed.length+'</div><div class="kpi-sub">WR free '+wrOf(agreed,'free')+' / paid '+wrOf(agreed,'paid')+'</div></div>';
  h+='<div class="card"><div class="card-title">Paid-Only &#9888;</div><div class="kpi-val gold">'+paidOnly.length+'</div><div class="kpi-sub">WR: '+wrOf(paidOnly)+' (key question)</div></div>';
  h+='<div class="card"><div class="card-title">Free-Only</div><div class="kpi-val blue">'+freeOnly.length+'</div><div class="kpi-sub">WR: '+wrOf(freeOnly)+'</div></div>';
  h+='<div class="card"><div class="card-title">Currently Open</div><div class="kpi-val cyan">'+freeOpen.length+' / '+paidOpen.length+'</div><div class="kpi-sub">Free / Paid</div></div></div>';
  h+='<div class="grid3" style="margin-bottom:16px">';
  h+='<div class="card"><div class="card-title">Free Indicator (109218)</div><div class="grid2" style="gap:8px"><div class="mini-kpi"><div class="mini-kpi-val '+(totPnl(freeCl)>=0?'green':'red')+'">'+fmtPnl(totPnl(freeCl))+'</div><div class="mini-kpi-lbl">Net P&L</div></div><div class="mini-kpi"><div class="mini-kpi-val">'+wrOf(freeCl)+'</div><div class="mini-kpi-lbl">Win Rate ('+freeCl.length+'t)</div></div><div class="mini-kpi"><div class="mini-kpi-val">'+avgGap(freeCl)+'</div><div class="mini-kpi-lbl">Avg Gap</div></div><div class="mini-kpi"><div class="mini-kpi-val cyan">'+freeOpen.length+'</div><div class="mini-kpi-lbl">Open Now</div></div></div></div>';
  h+='<div class="card"><div class="card-title">Paid Indicator (107499)</div><div class="grid2" style="gap:8px"><div class="mini-kpi"><div class="mini-kpi-val '+(totPnl(paidCl)>=0?'green':'red')+'">'+fmtPnl(totPnl(paidCl))+'</div><div class="mini-kpi-lbl">Net P&L</div></div><div class="mini-kpi"><div class="mini-kpi-val">'+wrOf(paidCl)+'</div><div class="mini-kpi-lbl">Win Rate ('+paidCl.length+'t)</div></div><div class="mini-kpi"><div class="mini-kpi-val">'+avgGap(paidCl)+'</div><div class="mini-kpi-lbl">Avg Gap</div></div><div class="mini-kpi"><div class="mini-kpi-val cyan">'+paidOpen.length+'</div><div class="mini-kpi-lbl">Open Now</div></div></div></div>';
  h+='<div class="card"><div class="card-title">Gap Comparison</div><div style="font-size:11px;color:var(--sub);margin-bottom:8px">Does paid indicator fire on lower gaps (more marginal)?</div><div style="margin-bottom:6px"><span style="font-size:11px;font-weight:600">Free avg gap: </span><strong style="color:var(--blue)">'+avgGap(freeCl)+'</strong></div><div style="margin-bottom:6px"><span style="font-size:11px;font-weight:600">Paid avg gap: </span><strong style="color:var(--gold)">'+avgGap(paidCl)+'</strong></div>'+(paidOnly.length?'<div style="background:#fef3c7;border-radius:6px;padding:8px;font-size:11px;margin-top:8px">Paid-only avg gap: <strong>'+avgGap(paidOnly)+'</strong></div>':'')+'</div></div>';
  if(paidOnly.length){h+='<div class="card" style="margin-bottom:16px"><div class="card-title">Paid-Only Trades — Free Missed These &#9888;</div><div class="tbl-wrap" style="max-height:280px"><table><thead><tr><th>Date</th><th>Pair</th><th>Dir</th><th>Gap</th><th>Strong</th><th>Weak</th><th>P&L</th><th>Result</th></tr></thead><tbody>';paidOnly.slice().reverse().forEach(function(t){var p=parseFloat(t.pnl||0);h+='<tr><td style="color:var(--sub)">'+(t.ts||'').slice(0,10)+'</td><td style="color:var(--blue);font-weight:700">'+(t.symbol||'—')+'</td><td><span class="badge-'+(t.direction||'').toLowerCase()+'">'+(t.direction||'—')+'</span></td><td>'+parseFloat(t.gap||0).toFixed(3)+'</td><td style="color:var(--green)">'+(t.strong_cur||'—')+'</td><td style="color:var(--red)">'+(t.weak_cur||'—')+'</td><td style="font-weight:700;color:'+(p>=0?'var(--green)':'var(--red)')+'">'+fmtPnl(p)+'</td><td><span style="font-weight:700;font-size:10px;color:'+(p>0?'var(--green)':'var(--red)')+'">'+(p>0?'WIN':'LOSS')+'</span></td></tr>';});h+='</tbody></table></div></div>';}
  h+='<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11px;color:var(--sub)">Agreement = same pair + direction + same calendar day. Needs 50+ trades per account for meaningful conclusions.</div>';
  c.innerHTML=h;
}
