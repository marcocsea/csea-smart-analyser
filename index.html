<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSEA Smart Analyser v4.0</title>
<style>
:root{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#f8fafc;--border:#e2e8f0;--text:#1e293b;--sub:#64748b;--green:#16a34a;--red:#dc2626;--blue:#3b82f6;--gold:#d97706;--cyan:#0891b2;--purple:#7c3aed;--orange:#ea580c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px;min-height:100vh}
.header{background:#1e40af;padding:0 20px;height:52px;display:flex;align-items:center;gap:12px}
.logo{font-size:15px;font-weight:700;color:#fff;letter-spacing:0}
.logo span{color:#bfdbfe}
.badge{background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.mode-switcher{display:flex;background:rgba(255,255,255,.15);border-radius:8px;padding:3px;gap:2px;margin-left:8px}
.mode-btn{padding:4px 12px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.7);background:transparent;transition:all .15s}
.mode-btn.active{background:rgba(255,255,255,.25);color:#fff}
.toolbar{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-size:11px;color:#64748b}
select{background:#f8fafc;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
input[type=date]{background:#f8fafc;color:#1e293b;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;outline:none}
button{padding:7px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-smart{background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff}.btn-smart:hover{opacity:.9}
.btn-gtmo{background:linear-gradient(90deg,#d97706,#dc2626);color:#fff}.btn-gtmo:hover{opacity:.9}
.status-dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.tabs{background:#ffffff;border-bottom:2px solid #e2e8f0;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;transition:all .15s;white-space:nowrap}
.tab.active{color:#1e40af;border-bottom-color:#3b82f6}
.tab.active.gtmo-tab{color:#d97706;border-bottom-color:#d97706}
.main{padding:20px;max-width:1400px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.kpi-val{font-size:22px;font-weight:700;color:#1e293b;margin-bottom:2px}
.kpi-sub{font-size:11px;color:var(--sub)}
.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.cyan{color:var(--cyan)}.blue{color:var(--blue)}
.analysis-panel{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;margin-bottom:16px}
.analysis-panel.gtmo{background:#fefce8;border-color:#fde68a}
.analysis-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.analysis-icon{width:34px;height:34px;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.analysis-icon.gtmo{background:linear-gradient(135deg,#d97706,#dc2626)}
.analysis-title{font-size:14px;font-weight:700;color:#1e293b}
.analysis-subtitle{font-size:11px;color:var(--sub)}
.insight-block{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-bottom:10px;border-left:3px solid #3b82f6}
.insight-block.warn{border-left-color:var(--gold)}
.insight-block.good{border-left-color:var(--green)}
.insight-block.bad{border-left-color:var(--red)}
.insight-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;color:var(--sub)}
.insight-block.warn .insight-label{color:var(--gold)}
.insight-block.good .insight-label{color:var(--green)}
.insight-block.bad .insight-label{color:var(--red)}
.insight-text{font-size:13px;color:#334155;line-height:1.7}
.insight-text strong{color:#1e293b}
.rec-list{list-style:none;margin-top:8px}
.rec-list li{padding:5px 0;font-size:12px;color:#475569;display:flex;gap:8px;line-height:1.5}
.rec-list li::before{content:'→';color:var(--blue);flex-shrink:0;font-weight:700}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.check-row:last-child{border-bottom:none}
.check-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ci-ok{background:rgba(34,197,94,.15);color:var(--green)}
.ci-warn{background:rgba(245,158,11,.15);color:var(--gold)}
.ci-fail{background:rgba(239,68,68,.15);color:var(--red)}
.check-label{font-size:12px;font-weight:600;color:#1e293b;flex:1}
.check-detail{font-size:11px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f8fafc;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge-buy{background:rgba(34,197,94,.15);color:var(--green);padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.badge-sell{background:rgba(239,68,68,.15);color:var(--red);padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.badge-blocked{background:rgba(245,158,11,.15);color:var(--gold);padding:2px 7px;border-radius:4px;font-size:10px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.pill-g{background:rgba(34,197,94,.15);color:var(--green)}
.pill-r{background:rgba(239,68,68,.15);color:var(--red)}
.pill-b{background:rgba(59,130,246,.15);color:var(--blue)}
.pill-gold{background:rgba(217,119,6,.15);color:var(--gold)}
.tbl-wrap{overflow-x:auto;max-height:380px;overflow-y:auto}
.snap-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snap-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}
.snap-cur{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px}
.snap-val{font-size:16px;font-weight:800}
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-bar{height:100%;border-radius:3px;transition:width .5s}
.anomaly-item{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px;margin-bottom:8px}
.anomaly-item.aw{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2)}
.anomaly-title{font-size:12px;font-weight:700;color:var(--red);margin-bottom:4px}
.anomaly-item.aw .anomaly-title{color:var(--gold)}
.anomaly-desc{font-size:11px;color:var(--sub);line-height:1.6}
#loadStatus{font-size:11px;color:var(--sub)}
.score-ring{display:flex;align-items:center;gap:16px}
.score-circle{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;border:3px solid}
.hour-chart{display:flex;flex-direction:column;gap:4px}
.hour-row{display:flex;align-items:center;gap:10px;padding:3px 0}
.hour-label{font-size:11px;font-weight:700;color:var(--sub);width:50px;flex-shrink:0;text-align:right}
.hour-bar-wrap{flex:1;display:flex;align-items:center;gap:8px}
.hour-bar{height:22px;border-radius:3px;min-width:3px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.hour-stats{font-size:11px;color:var(--sub);white-space:nowrap;min-width:140px}
.exit-tp{background:rgba(34,197,94,.15);color:var(--green);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-sl{background:rgba(239,68,68,.15);color:var(--red);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-ea{background:rgba(8,145,178,.15);color:var(--cyan);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.exit-manual{background:rgba(245,158,11,.15);color:var(--gold);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.src-badge{background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.gtmo-badge{background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
/* GTMO specific */
.acct-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.acct-card.selected{border-color:#d97706;box-shadow:0 0 0 2px rgba(217,119,6,.15)}
.health-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.health-green{background:rgba(34,197,94,.12);color:#15803d}
.health-gold{background:rgba(245,158,11,.12);color:#b45309}
.health-red{background:rgba(239,68,68,.12);color:#b91c1c}
.runner-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.runner-row:last-child{border-bottom:none}
.runner-label{font-size:11px;font-weight:700;width:60px;flex-shrink:0;color:#334155}
.runner-bar-wrap{flex:1;display:flex;align-items:center;gap:8px}
.runner-bar{height:24px;border-radius:4px;min-width:4px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;transition:width .6s}
.runner-stats{font-size:11px;color:var(--sub);white-space:nowrap;min-width:160px}
.equity-line{fill:none;stroke-width:2}
.eq-area{opacity:.1}
.streak-box{background:var(--bg3);border-radius:8px;padding:12px;text-align:center}
.streak-num{font-size:28px;font-weight:800}
.mini-kpi{background:var(--bg3);border-radius:8px;padding:10px 12px}
.mini-kpi-val{font-size:18px;font-weight:800;color:#1e293b}
.mini-kpi-lbl{font-size:10px;color:var(--sub);margin-top:2px}
.waterfall-wrap{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 4px}
.wf-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.wf-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .5s}
.wf-label{font-size:9px;font-weight:700;color:var(--sub);text-align:center}
.wf-pct{font-size:10px;font-weight:800;text-align:center}
.session-result-win{background:rgba(34,197,94,.1);color:#15803d;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.session-result-loss{background:rgba(239,68,68,.1);color:#b91c1c;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.session-result-be{background:rgba(100,116,139,.1);color:var(--sub);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.ea-tag{background:#dbeafe;color:#1e40af;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.manual-tag{background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.divider{height:1px;background:var(--border);margin:12px 0}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CSEA <span>Smart</span> Analyser</div>
  <div class="badge">v4.0</div>
  <div class="mode-switcher">
    <button class="mode-btn active" id="modeCsea" onclick="switchMode('csea')">CSEA</button>
    <button class="mode-btn" id="modeGtmo" onclick="switchMode('gtmo')">GTMO·GTS</button>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusTxt" style="font-size:11px;color:rgba(255,255,255,.7)">Idle</span>
  </div>
</div>

<!-- CSEA toolbar -->
<div class="toolbar" id="toolbarCsea">
  <span class="lbl">Account:</span>
  <select id="acctSelect"></select>
  <span class="lbl">Clean Start:</span>
  <input type="date" id="cleanStart" value="2026-03-23">
  <button class="btn-primary" onclick="loadData()">Load &amp; Analyse</button>
  <button class="btn-smart" onclick="setTab('analysis',null);render()">Smart Analysis</button>
  <span id="loadStatus"></span>
</div>

<!-- GTMO toolbar -->
<div class="toolbar" id="toolbarGtmo" style="display:none">
  <span class="lbl">Account:</span>
  <select id="gtmoAcctSelect">
    <option value="all">All GTMO·GTS</option>
    <option value="a1e93eec-db3e-4d72-baa3-cf0cd33d2dc6">4xHub MO Gold</option>
    <option value="c6596cb8-760f-480b-97b5-f4a3954c1b90">GTMO Demo</option>
    <option value="75fb14d6-0f3a-4196-86fc-c93d78f3d1b2">GTS Vantage Demo</option>
  </select>
  <button class="btn-gtmo" onclick="loadGtmoData()">Load &amp; Analyse</button>
  <span id="gtmoLoadStatus" style="font-size:11px;color:var(--sub)"></span>
</div>

<div class="tabs" id="tabBar">
  <button class="tab active" onclick="setTab('overview',this)">Overview</button>
  <button class="tab" onclick="setTab('analysis',this)">Smart Analysis</button>
  <button class="tab" onclick="setTab('hour',this)">Hour of Day</button>
  <button class="tab" onclick="setTab('pairs',this)">Pair Performance</button>
  <button class="tab" onclick="setTab('exits',this)">Exit Analysis</button>
  <button class="tab" onclick="setTab('positions',this)">Positions</button>
  <button class="tab" onclick="setTab('signals',this)">Signals</button>
  <button class="tab" onclick="setTab('compound',this)">Compound</button>
  <button class="tab" onclick="setTab('snapshot',this)">Currency Snapshot</button>
  <button class="tab" onclick="setTab('anomalies',this)">Anomalies</button>
</div>

<div class="tabs" id="gtmoTabBar" style="display:none">
  <button class="tab gtmo-tab active" onclick="setGtmoTab('overview',this)">Overview</button>
  <button class="tab" onclick="setGtmoTab('runners',this)">Runner Analysis</button>
  <button class="tab" onclick="setGtmoTab('sessions',this)">Session Log</button>
  <button class="tab" onclick="setGtmoTab('intelligence',this)">Strategy Intelligence</button>
</div>

<div class="main" id="mainContent">
  <div class="empty">
    <div style="font-size:36px;margin-bottom:10px">🧠</div>
    <p style="color:#1e293b;font-size:15px;font-weight:700;margin-bottom:6px">CSEA Smart Analyser v4.0</p>
    <p style="color:var(--sub)">Select an account, set clean-start date, then click Load &amp; Analyse</p>
  </div>
</div>

<script>
var SB_URL = 'https://nmyveijljquxvhjelqbc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5teXZlaWpsanF1eHZoamVscWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjc2MjgsImV4cCI6MjA4Nzk0MzYyOH0.YT-sAh2Spn1805dnylTsZ2gBx-T7yC6fyOKIs0YPlP4';
var HDR = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY};

// CSEA state
var db = {posData:[], signals:[], daily:[], trades:[]};
var acctId = '', activeTab = 'overview';
var checks = [], anomalies = [], insights = [];

// GTMO state
var gtmoDb = {sessions:[], orders:[]};
var gtmoAcctId = 'all';
var activeGtmoTab = 'overview';
var currentMode = 'csea';

// ─── SHARED FETCH ──────────────────────────────────────────────
async function sb(table, params) {
  var PAGE = 1000, all = [], from = 0;
  while(true) {
    var r = await fetch(SB_URL + '/rest/v1/' + table + '?' + params + '&limit=' + PAGE + '&offset=' + from, {
      headers: Object.assign({}, HDR, {'Range-Unit':'items','Range':from+'-'+(from+PAGE-1)})
    });
    if(!r.ok) break;
    var pg = await r.json();
    all = all.concat(pg);
    if(pg.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

// ─── MODE SWITCH ───────────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('modeCsea').className = 'mode-btn' + (mode==='csea'?' active':'');
  document.getElementById('modeGtmo').className = 'mode-btn' + (mode==='gtmo'?' active':'');
  document.getElementById('toolbarCsea').style.display = mode==='csea' ? '' : 'none';
  document.getElementById('toolbarGtmo').style.display = mode==='gtmo' ? '' : 'none';
  document.getElementById('tabBar').style.display = mode==='csea' ? '' : 'none';
  document.getElementById('gtmoTabBar').style.display = mode==='gtmo' ? '' : 'none';
  if(mode === 'gtmo') {
    if(gtmoDb.sessions.length) renderGtmo();
    else {
      document.getElementById('mainContent').innerHTML = '<div class="empty"><div style="font-size:36px;margin-bottom:10px">⚡</div><p style="color:#1e293b;font-size:15px;font-weight:700;margin-bottom:6px">GTMO·GTS Analyser</p><p style="color:var(--sub)">Select an account and click Load &amp; Analyse</p></div>';
      loadGtmoData();
    }
  } else {
    if(db.posData.length) render();
    else document.getElementById('mainContent').innerHTML = '<div class="empty"><div style="font-size:36px;margin-bottom:10px">🧠</div><p style="color:#1e293b;font-size:15px;font-weight:700;margin-bottom:6px">CSEA Smart Analyser v4.0</p><p style="color:var(--sub)">Select an account, set clean-start date, then click Load &amp; Analyse</p></div>';
  }
}

// ─── GTMO DATA LOAD ────────────────────────────────────────────
async function loadGtmoData() {
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusTxt');
  var st  = document.getElementById('gtmoLoadStatus');
  dot.className = 'status-dot'; txt.textContent = 'Loading...';
  st.textContent = 'Fetching sessions & orders...';
  gtmoAcctId = document.getElementById('gtmoAcctSelect').value;

  try {
    var acctFilter = gtmoAcctId !== 'all'
      ? '&account_id=eq.' + gtmoAcctId
      : '&account_id=in.(a1e93eec-db3e-4d72-baa3-cf0cd33d2dc6,c6596cb8-760f-480b-97b5-f4a3954c1b90,75fb14d6-0f3a-4196-86fc-c93d78f3d1b2)';

    var res = await Promise.all([
      sb('gtmo_sessions', 'select=*,accounts(label)&order=session_date,session_open' + acctFilter),
      sb('gtmo_orders',   'select=*&order=close_time' + acctFilter)
    ]);
    gtmoDb.sessions = res[0];
    gtmoDb.orders   = res[1];

    dot.className = 'status-dot live';
    txt.textContent = 'Live';
    st.textContent = gtmoDb.sessions.length + ' sessions · ' + gtmoDb.orders.length + ' orders';
    renderGtmo();
  } catch(e) {
    dot.className = 'status-dot';
    txt.textContent = 'Error';
    st.textContent = 'Error: ' + e.message;
  }
}

// ─── GTMO TAB ─────────────────────────────────────────────────
function setGtmoTab(id, btn) {
  activeGtmoTab = id;
  document.querySelectorAll('#gtmoTabBar .tab').forEach(function(t){
    t.classList.remove('active','gtmo-tab');
  });
  if(btn) { btn.classList.add('active','gtmo-tab'); }
  else {
    var map = ['overview','runners','sessions','intelligence'];
    var idx = map.indexOf(id);
    var tabs = document.querySelectorAll('#gtmoTabBar .tab');
    if(idx >= 0) { tabs[idx].classList.add('active','gtmo-tab'); }
  }
  renderGtmo();
}

function renderGtmo() {
  if(!gtmoDb.sessions.length) return;
  var c = document.getElementById('mainContent');
  if(activeGtmoTab === 'overview')      c.innerHTML = renderGtmoOverview();
  else if(activeGtmoTab === 'runners')  c.innerHTML = renderGtmoRunners();
  else if(activeGtmoTab === 'sessions') c.innerHTML = renderGtmoSessions();
  else if(activeGtmoTab === 'intelligence') c.innerHTML = renderGtmoIntelligence();
}

// ─── GTMO HELPERS ─────────────────────────────────────────────
function fmtPnl(v) { var n = parseFloat(v||0); return (n>=0?'+':'') + n.toFixed(2); }
function fmtPct(v) { return v.toFixed(1) + '%'; }
function siIcon(s) { return s==='ok'?'✓':s==='warn'?'⚠':'✗'; }
function siCls(s)  { return s==='ok'?'ci-ok':s==='warn'?'ci-warn':'ci-fail'; }

function getGtmoAcctLabel(id) {
  var map = {
    'a1e93eec-db3e-4d72-baa3-cf0cd33d2dc6': '4xHub MO Gold',
    'c6596cb8-760f-480b-97b5-f4a3954c1b90': 'GTMO Demo',
    '75fb14d6-0f3a-4196-86fc-c93d78f3d1b2': 'GTS Vantage Demo'
  };
  return map[id] || id;
}

function getGtmoAcctIds() {
  if(gtmoAcctId !== 'all') return [gtmoAcctId];
  return ['a1e93eec-db3e-4d72-baa3-cf0cd33d2dc6','c6596cb8-760f-480b-97b5-f4a3954c1b90','75fb14d6-0f3a-4196-86fc-c93d78f3d1b2'];
}

function sessionsFor(aId) {
  if(!aId || aId === 'all') return gtmoDb.sessions;
  return gtmoDb.sessions.filter(function(s){ return s.account_id === aId; });
}

function ordersFor(aId) {
  if(!aId || aId === 'all') return gtmoDb.orders;
  return gtmoDb.orders.filter(function(o){ return o.account_id === aId; });
}

function getGtmoKpis(sessions) {
  var wins   = sessions.filter(function(s){ return s.result === 'WIN'; });
  var losses = sessions.filter(function(s){ return s.result === 'LOSS'; });
  var total  = sessions.reduce(function(a,s){ return a + parseFloat(s.net_pnl||0); }, 0);
  var avgW   = wins.length   ? wins.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0)/wins.length : 0;
  var avgL   = losses.length ? losses.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0)/losses.length : 0;
  var wr     = sessions.length ? wins.length / sessions.length * 100 : 0;
  var rr     = avgL ? Math.abs(avgW / avgL) : 0;

  // streak
  var streak = 0, streakType = '';
  var sorted = sessions.slice().sort(function(a,b){ return a.session_date > b.session_date ? 1 : -1; });
  if(sorted.length) {
    var last = sorted[sorted.length-1].result;
    streakType = last;
    for(var i = sorted.length-1; i >= 0; i--) {
      if(sorted[i].result === last) streak++;
      else break;
    }
  }

  // drawdown from last balance_close
  var withBal = sessions.filter(function(s){ return s.balance_close && parseFloat(s.balance_close) > 0; });
  var peak = 0, dd = 0;
  withBal.forEach(function(s){
    var b = parseFloat(s.balance_close);
    if(b > peak) peak = b;
    var cur_dd = peak > 0 ? (peak - b) / peak * 100 : 0;
    if(cur_dd > dd) dd = cur_dd;
  });

  return { wins: wins.length, losses: losses.length, total: sessions.length, totalPnl: total, avgWin: avgW, avgLoss: avgL, wr: wr, rr: rr, streak: streak, streakType: streakType, maxDd: dd };
}

function getRunnerStats(orders) {
  // Parse comment tags to extract runner levels
  // Shield (S) = initial cluster, Generator (G) = runner, Ex = partial runner level
  var stats = {
    totalSessions: 0,
    shield: {tp:0, sl:0},
    generator: {tp:0, sl:0},
    addon: {fired:0, sl:0, pnl:0},
    runners: {} // E1..E8 tp/sl counts
  };
  for(var i = 1; i <= 8; i++) {
    stats.runners['E'+i] = {tp:0, sl:0, pnl:0};
  }

  orders.forEach(function(o) {
    var c = (o.comment || '').trim();
    if(!c) return;

    // Shield base
    if(c === 'GTMO-S[tp]') { stats.shield.tp++; }
    else if(c === 'GTMO-S[sl]') { stats.shield.sl++; }

    // Generator full
    else if(c === 'GTMO-G[tp]') { stats.generator.tp++; }
    else if(c === 'GTMO-G[sl]') { stats.generator.sl++; }

    // Add-on
    else if(c.indexOf('GTMO-ADDON') === 0) {
      stats.addon.fired++;
      if(c.indexOf('[sl]') > -1) stats.addon.sl++;
      stats.addon.pnl += parseFloat(o.profit||0);
    }

    // Runner partials E1-E8
    for(var lvl = 1; lvl <= 8; lvl++) {
      var key = 'E' + lvl;
      if(c === 'GTMO-S-' + key + '[tp]' || c === 'GTMO-G-' + key + '[tp]') {
        stats.runners[key].tp++;
        stats.runners[key].pnl += parseFloat(o.profit||0);
      } else if(c === 'GTMO-S-' + key + '[sl]' || c === 'GTMO-G-' + key + '[sl]') {
        stats.runners[key].sl++;
        stats.runners[key].pnl += parseFloat(o.profit||0);
      }
    }
  });

  return stats;
}

function getEquityCurve(sessions, acctId) {
  var sorted = sessionsFor(acctId).filter(function(s){ return s.balance_close && parseFloat(s.balance_close) > 0; })
    .sort(function(a,b){ return a.session_date > b.session_date ? 1 : -1; });
  if(!sorted.length) return [];
  return sorted.map(function(s){ return { date: s.session_date, bal: parseFloat(s.balance_close) }; });
}

        var rs2 = getRunnerStats(os2);
        var tp = rs2.runners[k].tp, sl = rs2.runners[k].sl, tot = tp+sl;
        var pct = tot ? Math.round(tp/tot*100) : null;
        var col = pct===null?'var(--sub)':pct>=60?'var(--green)':pct>=35?'var(--gold)':'var(--red)';
        h += '<td style="font-weight:700;color:' + col + '">' + (pct!==null?pct+'%':'—') + '</td>';
        h += '<td style="color:var(--sub);font-size:11px">' + (tot?tp+'tp/'+sl+'sl':'—') + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
  }

  return h;
}

// ─── GTMO SESSION LOG ─────────────────────────────────────────
function renderGtmoSessions() {
  var sessions = gtmoDb.sessions.slice().sort(function(a,b){ return a.session_date > b.session_date ? -1 : 1; });

  h += '<option value="c6596cb8-760f-480b-97b5-f4a3954c1b90">GTMO Demo</option>';
  h += '<option value="75fb14d6-0f3a-4196-86fc-c93d78f3d1b2">GTS Vantage Demo</option>';

  var faDir  = (document.getElementById('sfDir') || {value:''}).value || '';

  if(faAcct) sessions = sessions.filter(function(s){ return s.account_id === faAcct; });
  if(faRes)  sessions = sessions.filter(function(s){ return s.result === faRes; });
  if(faDir)  sessions = sessions.filter(function(s){ return s.signal_direction === faDir; });

  // Summary strip
  var wins = sessions.filter(function(s){return s.result==='WIN';}).length;

  h += '<div class="card"><div class="card-title">Net P&L</div><div class="kpi-val ' + (totalPnl>=0?'green':'red') + '">' + fmtPnl(totalPnl) + '</div><div class="kpi-sub">filtered sessions</div></div>';
  var avgPnl = sessions.length ? totalPnl/sessions.length : 0;
  h += '<div class="card"><div class="card-title">Avg P&L / Session</div><div class="kpi-val ' + (avgPnl>=0?'green':'red') + '">' + fmtPnl(avgPnl) + '</div><div class="kpi-sub">per session</div></div>';
  h += '</div>';

  h += '<div class="card"><div class="tbl-wrap" style="max-height:500px"><table>';
  h += '<thead><tr><th>Date</th><th>Account</th><th>Direction</th><th>Result</th><th>Net P&L</th><th>Balance After</th><th>Pips</th><th>Notes</th></tr></thead><tbody>';

  sessions.forEach(function(s) {
    var pnl = parseFloat(s.net_pnl||0);

    var dirCls = s.signal_direction==='BUY'?'badge-buy':s.signal_direction==='SELL'?'badge-sell':'';
    var label = (s.accounts && s.accounts.label) || getGtmoAcctLabel(s.account_id);

    // Parse pips from notes

    }

    // Clean notes for display

    var exitTag = exitMatch ? '<span style="font-size:10px;background:#e2e8f0;padding:1px 5px;border-radius:3px;color:var(--sub)">' + exitMatch[1] + '</span> ' : '';

    h += '<tr>';
    h += '<td style="white-space:nowrap">' + s.session_date + '</td>';
    h += '<td style="font-size:11px;color:var(--sub)">' + label + '</td>';
    h += '<td>' + (s.signal_direction ? '<span class="' + dirCls + '">' + s.signal_direction + '</span>' : '—') + '</td>';
    h += '<td><span class="' + resultCls + '">' + (s.result||'—') + '</span></td>';
    h += '<td style="font-weight:700;color:' + (pnl>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(pnl) + '</td>';

    h += '<td>' + pips + '</td>';

    h += '</tr>';
  });

  h += '</tbody></table></div></div>';
  return h;
}

// ─── GTMO STRATEGY INTELLIGENCE ───────────────────────────────
function renderGtmoIntelligence() {
  var h = '';

  var acctDefs = [
    {id:'a1e93eec-db3e-4d72-baa3-cf0cd33d2dc6', label:'4xHub MO Gold', isLive:true},
    {id:'c6596cb8-760f-480b-97b5-f4a3954c1b90', label:'GTMO Demo', isLive:false},
    {id:'75fb14d6-0f3a-4196-86fc-c93d78f3d1b2', label:'GTS Vantage Demo', isLive:false}
  ];
  var showAccts = gtmoAcctId === 'all' ? acctDefs : acctDefs.filter(function(a){ return a.id === gtmoAcctId; });

  showAccts.forEach(function(acct) {
    var ss = sessionsFor(acct.id);
    if(!ss.length) return;
    var os = ordersFor(acct.id);
    var kpis = getGtmoKpis(ss);
    var rs = getRunnerStats(os);

    // Build checks
    var acctChecks = [];
    acctChecks.push({label:'Win Rate', detail: kpis.wr.toFixed(1) + '% (' + kpis.wins + 'W/' + kpis.losses + 'L)', status: kpis.wr>=55?'ok':kpis.wr>=40?'warn':'fail'});
    acctChecks.push({label:'Risk:Reward', detail: 'R:R ' + kpis.rr.toFixed(2) + ' · Avg win £' + kpis.avgWin.toFixed(2) + ' / Avg loss £' + Math.abs(kpis.avgLoss).toFixed(2), status: kpis.rr>=1?'ok':kpis.rr>=0.7?'warn':'fail'});
    acctChecks.push({label:'Max Drawdown', detail: kpis.maxDd.toFixed(1) + '%', status: kpis.maxDd<15?'ok':kpis.maxDd<30?'warn':'fail'});
    acctChecks.push({label:'Current Streak', detail: kpis.streak + ' consecutive ' + (kpis.streakType||'—'), status: kpis.streakType==='LOSS'&&kpis.streak>=3?'fail':kpis.streakType==='LOSS'&&kpis.streak>=2?'warn':'ok'});

    // Generator analysis
    var gTotal = rs.generator.tp + rs.generator.sl;
    var gPct = gTotal ? Math.round(rs.generator.tp/gTotal*100) : null;
    if(gTotal > 0) acctChecks.push({label:'Generator Survival', detail: (gPct||0) + '% reach full TP (' + gTotal + ' sessions)', status: gPct>=40?'ok':gPct>=25?'warn':'fail'});

    // Add-on check
    if(rs.addon.fired > 0) {
      var adSlPct = Math.round(rs.addon.sl/rs.addon.fired*100);
      acctChecks.push({label:'Add-On Performance', detail: rs.addon.fired + ' trades · ' + adSlPct + '% SL · £' + fmtPnl(rs.addon.pnl), status: adSlPct>=80?'fail':adSlPct>=60?'warn':'ok'});
    }

    // Trend check
    var sorted = ss.slice().sort(function(a,b){return a.session_date>b.session_date?1:-1;});
    var last10 = sorted.slice(-10), prev10 = sorted.slice(-20,-10);
    var last10Pnl = last10.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0);
    var prev10Pnl = prev10.length ? prev10.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0) : null;
    if(prev10Pnl !== null) {
      acctChecks.push({label:'10-Session Trend', detail: 'Last 10: £' + fmtPnl(last10Pnl) + ' vs prev 10: £' + fmtPnl(prev10Pnl), status: last10Pnl > prev10Pnl ? 'ok' : last10Pnl > prev10Pnl * 0.5 ? 'warn' : 'fail'});
    }

    var passC = acctChecks.filter(function(c){return c.status==='ok';}).length;
    var hPct = acctChecks.length ? Math.round(passC/acctChecks.length*100) : 0;
    var hCol = hPct>=75?'var(--green)':hPct>=50?'var(--gold)':'var(--red)';

    h += '<div class="analysis-panel gtmo" style="margin-bottom:16px">';
    h += '<div class="analysis-header">';
    h += '<div class="analysis-icon gtmo">⚡</div>';
    h += '<div><div class="analysis-title">' + acct.label + ' — Strategy Intelligence</div>';
    h += '<div class="analysis-subtitle">' + ss.length + ' sessions · ' + os.length + ' orders · ' + (acct.isLive ? 'Live account' : 'Demo — pure EA results') + '</div></div>';
    h += '<div style="margin-left:auto"><div class="score-ring"><div class="score-circle" style="color:' + hCol + ';border-color:' + hCol + '">' + hPct + '%</div><div><div style="font-size:12px;font-weight:700">Strategy Health</div><div style="font-size:11px;color:var(--sub)">' + passC + '/' + acctChecks.length + ' checks passing</div></div></div></div>';
    h += '</div>';

    // Checks
    acctChecks.forEach(function(c) {
      h += '<div class="check-row"><div class="check-icon ' + siCls(c.status) + '">' + siIcon(c.status) + '</div><div class="check-label">' + c.label + '</div><div class="check-detail">' + c.detail + '</div></div>';
    });

    h += '</div>';

    // GTMO Demo special — raw strategy insights
    if(!acct.isLive) {
      h += '<div class="card" style="margin-bottom:16px">';
      h += '<div class="card-title">GTMO Demo — Pure Strategy Analysis (EA only, no manual interference)</div>';

      // Big loss analysis
      var bigLoss = ss.filter(function(s){ return parseFloat(s.net_pnl||0) < -30; });
      var bigWin  = ss.filter(function(s){ return parseFloat(s.net_pnl||0) > 30; });
      var avgBigL = bigLoss.length ? bigLoss.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0)/bigLoss.length : 0;
      var avgBigW = bigWin.length  ? bigWin.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0)/bigWin.length : 0;

      h += '<div class="grid3" style="margin-bottom:12px">';
      h += '<div class="mini-kpi"><div class="mini-kpi-val red">' + bigLoss.length + '</div><div class="mini-kpi-lbl">Large Losses (&gt;£30)<br>Avg: ' + fmtPnl(avgBigL) + '</div></div>';
      h += '<div class="mini-kpi"><div class="mini-kpi-val green">' + bigWin.length + '</div><div class="mini-kpi-lbl">Large Wins (&gt;£30)<br>Avg: +£' + avgBigW.toFixed(2) + '</div></div>';
      h += '<div class="mini-kpi"><div class="mini-kpi-val ' + (avgBigW + avgBigL >= 0 ? 'green' : 'red') + '">' + fmtPnl(avgBigW + avgBigL) + '</div><div class="mini-kpi-lbl">Net of large events</div></div>';
      h += '</div>';

      // Direction performance
      var buyS  = ss.filter(function(s){ return s.signal_direction === 'BUY'; });
      var sellS = ss.filter(function(s){ return s.signal_direction === 'SELL'; });
      var buyWR  = buyS.length  ? Math.round(buyS.filter(function(s){return s.result==='WIN';}).length/buyS.length*100) : 0;
      var sellWR = sellS.length ? Math.round(sellS.filter(function(s){return s.result==='WIN';}).length/sellS.length*100) : 0;
      var buyPnl  = buyS.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0);
      var sellPnl = sellS.reduce(function(a,s){return a+parseFloat(s.net_pnl||0);},0);

      h += '<div style="font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Direction Performance</div>';
      h += '<div class="grid2" style="margin-bottom:12px">';
      h += '<div class="mini-kpi"><div style="display:flex;align-items:center;gap:8px"><span class="badge-buy">BUY</span><span style="font-size:15px;font-weight:800;color:' + (buyWR>=55?'var(--green)':buyWR>=40?'var(--gold)':'var(--red)') + '">' + buyWR + '%</span><span style="font-size:12px;font-weight:700;color:' + (buyPnl>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(buyPnl) + '</span></div><div class="mini-kpi-lbl">' + buyS.length + ' sessions</div></div>';
      h += '<div class="mini-kpi"><div style="display:flex;align-items:center;gap:8px"><span class="badge-sell">SELL</span><span style="font-size:15px;font-weight:800;color:' + (sellWR>=55?'var(--green)':sellWR>=40?'var(--gold)':'var(--red)') + '">' + sellWR + '%</span><span style="font-size:12px;font-weight:700;color:' + (sellPnl>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(sellPnl) + '</span></div><div class="mini-kpi-lbl">' + sellS.length + ' sessions</div></div>';
      h += '</div>';

      // Verdict
      var verdict = '';
      if(kpis.wr >= 55 && kpis.rr >= 1) {
        verdict = '<div class="insight-block good"><div class="insight-label">Strategy Verdict</div><div class="insight-text">Win rate and R:R both healthy. Strategy is mathematically sound. Monitor for mean reversion on large loss events.</div></div>';
      } else if(kpis.rr < 1 && kpis.wr < 55) {
        verdict = '<div class="insight-block bad"><div class="insight-label">Strategy Verdict</div><div class="insight-text"><strong>Both win rate (' + kpis.wr.toFixed(0) + '%) and R:R (' + kpis.rr.toFixed(2) + ') are below targets.</strong> Large Generator losses (-£' + Math.abs(kpis.avgLoss).toFixed(2) + ' avg) are the primary drag. The single Generator[tp] events (avg +£' + (rs.generator.tp ? (os.filter(function(o){return o.comment==='GTMO-G[tp]';}).reduce(function(a,o){return a+parseFloat(o.profit||0);},0)/rs.generator.tp).toFixed(2) : '?') + ') need to outweigh cumulative SL losses more frequently.</div></div>';
      } else {
        verdict = '<div class="insight-block warn"><div class="insight-label">Strategy Verdict</div><div class="insight-text">Mixed performance. Win rate ' + kpis.wr.toFixed(0) + '%, R:R ' + kpis.rr.toFixed(2) + '. Strategy needs more sessions to establish a clear pattern. Keep monitoring.</div></div>';
      }
      h += verdict;
      h += '</div>';
    }

    // 4xHub EA vs Manual breakdown
    if(acct.isLive) {
      var eaOrders  = os.filter(function(o){ return o.magic && parseInt(o.magic) !== 0; });
      var manOrders = os.filter(function(o){ return !o.magic || parseInt(o.magic) === 0; });
      var eaPnl  = eaOrders.reduce(function(a,o){return a+parseFloat(o.profit||0);},0);
      var manPnl = manOrders.reduce(function(a,o){return a+parseFloat(o.profit||0);},0);
      var eaWins  = 0, eaLoss = 0, manWins = 0, manLoss = 0;
      eaOrders.forEach(function(o){var p=parseFloat(o.profit||0);if(p>0)eaWins++;else if(p<0)eaLoss++;});
      manOrders.forEach(function(o){var p=parseFloat(o.profit||0);if(p>0)manWins++;else if(p<0)manLoss++;});

      h += '<div class="card" style="margin-bottom:16px">';
      h += '<div class="card-title">4xHub — EA vs Manual Trade Breakdown</div>';
      h += '<div class="grid2">';
      h += '<div class="mini-kpi"><div style="margin-bottom:8px"><span class="ea-tag">EA Trades</span></div>';
      h += '<div style="font-size:20px;font-weight:800;color:' + (eaPnl>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(eaPnl) + '</div>';
      h += '<div class="mini-kpi-lbl">' + eaOrders.length + ' orders · ' + eaWins + 'W / ' + eaLoss + 'L · ' + (eaOrders.length?Math.round(eaWins/eaOrders.length*100):0) + '% WR</div></div>';
      h += '<div class="mini-kpi"><div style="margin-bottom:8px"><span class="manual-tag">Manual Trades</span></div>';
      h += '<div style="font-size:20px;font-weight:800;color:' + (manPnl>=0?'var(--green)':'var(--red)') + '">' + fmtPnl(manPnl) + '</div>';
      h += '<div class="mini-kpi-lbl">' + manOrders.length + ' orders · ' + manWins + 'W / ' + manLoss + 'L · ' + (manOrders.length?Math.round(manWins/manOrders.length*100):0) + '% WR</div></div>';
      h += '</div></div>';
    }
  });

  return h || '<div class="empty"><p>No data for selected account</p></div>';
}

// ─── CSEA FUNCTIONS (unchanged from v3.0) ─────────────────────
function cleanStartDate() { return document.getElementById('cleanStart').value || '2026-03-23'; }

async function loadData() {
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusTxt');
  var cs = cleanStartDate();
  dot.className = 'status-dot'; txt.textContent = 'Loading...';
  document.getElementById('loadStatus').textContent = 'Fetching...';
  try {
    var accts = await sb('accounts', 'select=id,label,account_number&strategy=eq.CSEA&order=label');
    var sel = document.getElementById('acctSelect');
    sel.innerHTML = '<option value="">All CSEA Accounts</option>';
    accts.forEach(function(a) {
      var o = document.createElement('option');
      o.value = a.id; o.textContent = a.label || a.account_number;
      sel.appendChild(o);
    });
    if(!acctId && accts.length) { sel.value = accts[0].id; acctId = accts[0].id; }
    var af = acctId ? '&account_id=eq.' + acctId : '';
    var df_pos = cs ? '&open_time=gte.' + cs + 'T00:00:00' : '';
    var df_sig = cs ? '&ts=gte.' + cs + 'T00:00:00' : '';
    var df_day = cs ? '&date=gte.' + cs : '';
    var res = await Promise.all([
      sb('positions', 'select=*&order=open_time' + af + df_pos),
      sb('signals',   'select=*&order=ts' + af + df_sig),
      sb('daily',     'select=*&order=date' + af + df_day),
      sb('trades',    'select=ticket,event,symbol,direction,ts,entry,lot' + af + '&event=eq.OPEN')
    ]);
    db.posData = res[0]; db.signals = res[1]; db.daily = res[2]; db.trades = res[3];
    dot.className = 'status-dot live'; txt.textContent = 'Live';
    document.getElementById('loadStatus').textContent = db.posData.length + ' positions · ' + db.signals.length + ' signals · ' + db.daily.length + ' days';
    runAnalysis(); render();
  } catch(e) {
    dot.className = 'status-dot'; txt.textContent = 'Error';
    document.getElementById('loadStatus').textContent = 'Error: ' + e.message;
  }
}

function getStats() {
  var pos = db.posData;
  var wins = pos.filter(function(p){ return parseFloat(p.net_profit||0) > 0; });
  var losses = pos.filter(function(p){ return parseFloat(p.net_profit||0) < 0; });
  var totalPnl = pos.reduce(function(a,p){ return a + parseFloat(p.net_profit||0); }, 0);
  var avgWin = wins.length ? wins.reduce(function(a,p){ return a+parseFloat(p.net_profit||0); },0)/wins.length : 0;
  var avgLoss = losses.length ? losses.reduce(function(a,p){ return a+parseFloat(p.net_profit||0); },0)/losses.length : 0;
  var rr = avgLoss ? Math.abs(avgWin/avgLoss) : 0;
  var opened = db.signals.filter(function(s){ return s.result==='OPENED'; }).length;
  var lastDaily = db.daily.length ? db.daily[db.daily.length-1] : null;
  var openPos = db.trades.filter(function(t){ return t.event==='OPEN'; }).length;
  return { closed: pos.length, wins: wins.length, losses: losses.length, wr: pos.length ? wins.length/pos.length*100 : 0, totalPnl: totalPnl, avgWin: avgWin, avgLoss: avgLoss, rr: rr, opened: opened, blocked: db.signals.length - opened, positions: openPos, lastDaily: lastDaily };
}
function getPairStats() {
  var map = {};
  db.posData.forEach(function(p) {
    var s = p.symbol||'?';
    if(!map[s]) map[s]={sym:s,trades:0,wins:0,losses:0,pnl:0,winPnl:0,lossPnl:0};
    map[s].trades++;
    var n = parseFloat(p.net_profit||0);
    map[s].pnl += n;
    if(n>0){map[s].wins++;map[s].winPnl+=n;}else{map[s].losses++;map[s].lossPnl+=n;}
  });
  return Object.values(map).sort(function(a,b){return b.pnl-a.pnl;});
}
function getHourStats() {
  var map = {};
  db.posData.forEach(function(p) {
    if(!p.open_time) return;
    var h = new Date(p.open_time).getUTCHours();
    if(!map[h]) map[h]={hour:h,trades:0,wins:0,pnl:0};
    map[h].trades++;
    var n = parseFloat(p.net_profit||0);
    map[h].pnl += n;
    if(n>0) map[h].wins++;
  });
  var arr = [];
  for(var h=0;h<24;h++){if(map[h]) arr.push(map[h]);}
  return arr;
}
function getExitStats() {
  var pos = db.posData;
  var tp = pos.filter(function(p){ return p.close_reason==='tp'; });
  var sl = pos.filter(function(p){ return p.close_reason==='sl'; });
  var ea = pos.filter(function(p){ return p.close_reason==='ea'; });
  var manual = pos.filter(function(p){ return p.close_reason==='manual'; });
  function avg(arr) { return arr.length ? arr.reduce(function(a,p){return a+parseFloat(p.net_profit||0);},0)/arr.length : 0; }
  return { tp:tp.length, sl:sl.length, ea:ea.length, manual:manual.length, avgTp:avg(tp), avgSl:avg(sl), avgEa:avg(ea), avgManual:avg(manual), allPos: pos };
}
